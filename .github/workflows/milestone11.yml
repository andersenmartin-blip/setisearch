name: Milestone 11 LHS 1140 analysis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/milestone11.yml

permissions:
  contents: read

concurrency:
  group: milestone11-lhs1140
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out frozen repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector
        run: python -m pip install -e .

      - name: Run detector tests
        run: python -m unittest discover -s tests -v

      - name: Run known-answer validation
        run: |
          seti-repeater validate \
            --tsamp 18.253611008 \
            --channel-width 2.7939677238464355 \
            --output results_m11/validation.json

      - name: Extract preregistered telescope slices
        run: |
          seti-repeater extract \
            --config config/lhs1140b_new_target_m11.json \
            --data-dir data_m11 \
            --workers 8

      - name: Record data manifest
        shell: bash
        run: |
          find data_m11 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M11.sha256
          test "$(wc -l < DATA_MANIFEST_M11.sha256)" -eq 30
          sha256sum -c DATA_MANIFEST_M11.sha256

      - name: Run frozen complete search
        run: |
          seti-repeater search \
            --config config/lhs1140b_new_target_m11.json \
            --data-dir data_m11 \
            --output-dir results_m11

      - name: Repeat complete search
        run: |
          seti-repeater search \
            --config config/lhs1140b_new_target_m11.json \
            --data-dir data_m11 \
            --output-dir results_m11_repeat

      - name: Verify byte-identical primary outputs
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json

          primary = [
              "search_summary.json",
              "completeness.json",
              "scramble_nulls.npz",
              "window_summary.csv",
          ]
          comparisons = {}
          identical = True
          for name in primary:
              first = Path("results_m11") / name
              second = Path("results_m11_repeat") / name
              first_hash = sha256(first.read_bytes()).hexdigest()
              second_hash = sha256(second.read_bytes()).hexdigest()
              same = first_hash == second_hash
              identical &= same
              comparisons[name] = {
                  "first_sha256": first_hash,
                  "repeat_sha256": second_hash,
                  "byte_identical": same,
              }

          audit = {
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "config": "config/lhs1140b_new_target_m11.json",
              "detector_version": "0.4.0",
              "primary_outputs_byte_identical": identical,
              "comparisons": comparisons,
              "note": "The repeat directory is intentionally excluded from the distributable result package.",
          }
          Path("results_m11/reproducibility_audit.json").write_text(
              json.dumps(audit, indent=2) + "\n"
          )
          if not identical:
              raise SystemExit("Primary Milestone 11 outputs differ between complete runs")
          PY

      - name: Upload private result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone11-results
          path: |
            DATA_MANIFEST_M11.sha256
            results_m11
          if-no-files-found: warn
          retention-days: 14
