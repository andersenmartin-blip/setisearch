name: Radio hosted exact CAS service control 20261004a

on:
  push:
    branches: [m43-support-qualification]
    paths: ['config/radio_hosted_cas_control_20261004a.activate.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: radio-hosted-cas-control-20261004a
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.repository == 'andersenmartin-blip/setisearch' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/m43-support-qualification' &&
      github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact engineering activation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/radio_hosted_cas_control_20261004a.yml
            /RADIO_HOSTED_CAS_CONTROL_2026-10-04_PROTOCOL.md
            /results_radio_hosted_cas_control_20261004a/
            /config/radio_hosted_cas_control_20261004a.freeze.json
            /config/radio_hosted_cas_control_20261004a.activate.json

      - name: Require immutable preparation and marker-only activation
        id: activation
        run: >-
          python3 -I -B -S results_radio_hosted_cas_control_20261004a/activation_gate.py
          --output "$RUNNER_TEMP/radio-hosted-cas-control-20261004a-proof.json"

      - name: Observe one accepted CAS and one stale-before conflict
        id: control
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B -S results_radio_hosted_cas_control_20261004a/supervisor.py
          --output "$RUNNER_TEMP/radio-hosted-cas-control-20261004a"
          --proof "$RUNNER_TEMP/radio-hosted-cas-control-20261004a-proof.json"

      - name: Publish lossless reaped control evidence once
        if: always() && steps.activation.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B -S results_radio_hosted_cas_control_20261004a/publisher.py
          --output "$RUNNER_TEMP/radio-hosted-cas-control-20261004a"
          --proof "$RUNNER_TEMP/radio-hosted-cas-control-20261004a-proof.json"

      - name: Require successful service component result
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
        run: test "$CONTROL_OUTCOME" = success
