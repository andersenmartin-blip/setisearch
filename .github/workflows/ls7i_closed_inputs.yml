name: LS7I closed-sector input restoration

on:
  workflow_dispatch:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7i_closed_inputs.yml'
      - 'LS7I_INPUT_FREEZE.sha256'

permissions:
  contents: write

concurrency:
  group: ls7i-closed-inputs
  cancel-in-progress: false

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require the unpublished input boundary
        run: test ! -e results_ls7i_inputs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install the original pinned science dependencies
        run: python -m pip install -r requirements_ls7g.txt

      - name: Verify the input reconstruction implementation
        run: |
          set -o pipefail
          sha256sum -c LS7I_INPUT_FREEZE.sha256
          python -m unittest discover -s tests -p 'test_ls7i_inputs.py' -v 2>&1 | tee ls7i_input_tests.log

      - name: Restore and link both closed-sector inputs
        run: |
          set -o pipefail
          python -u scripts/ls7i_prepare_inputs.py --cache data_ls7i_sector32 2>&1 | tee ls7i_input_run.log

      - name: Independently check raw FITS and all historical recipes
        run: |
          set -o pipefail
          python -u scripts/ls7i_review_inputs.py --cache data_ls7i_sector32 2>&1 | tee ls7i_input_audit.log
          cp ls7i_input_run.log results_ls7i_inputs/RUN.log
          cp ls7i_input_audit.log results_ls7i_inputs/AUDIT.log
          cp ls7i_input_tests.log results_ls7i_inputs/TESTS.log
          python -m pip freeze > results_ls7i_inputs/environment.txt
          python scripts/ls7i_inputs_report.py --update-status

      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ls7i-closed-inputs
          retention-days: 90
          if-no-files-found: warn
          path: |
            ls7i_input_*.log
            results_ls7i_inputs/
            LS7I_CONTINUATION.md

      - name: Publish only the audited input package
        if: success()
        run: |
          sha256sum -c LS7I_INPUT_FREEZE.sha256
          (cd results_ls7i_inputs && sha256sum -c SHA256SUMS)
          git fetch origin m43-support-qualification
          test "$(git rev-parse origin/m43-support-qualification)" = "$GITHUB_SHA"
          git add results_ls7i_inputs LS7I_CONTINUATION.md PROJECT_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified closed-sector inputs for the joint LS7I model study'
          git push origin HEAD:m43-support-qualification
