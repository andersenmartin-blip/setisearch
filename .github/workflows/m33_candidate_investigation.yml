name: Milestone 33 HD 3651 candidate investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m33_candidate_investigation.yml"

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify frozen inputs and investigation protocol
        run: |
          test "$(sha256sum config/hd3651b_heldout_m33.json | cut -d' ' -f1)" \
            = "aaf4e2d53a4b95bb4428195d2567b9d3a8f8f60b62de104d8879c018b320971a"
          test "$(sha256sum results_m33/search_summary.json | cut -d' ' -f1)" \
            = "8bcc1b7fc2177d93b7a7ef47e7ec9bbe47e8ccc53d38fe7529ae49e389d8ab2b"
          test "$(sha256sum scripts/m11_candidate_investigation.py | cut -d' ' -f1)" \
            = "6565eb733fb5b3011564a8e98fce32c907aa90ab3890cfb7e9400c4c6419d2cb"
          test "$(sha256sum scripts/m33_candidate_investigation.py | cut -d' ' -f1)" \
            = "dba5c8df7725a90e8970251631781729e09bbac22959e759f182fc5e4d686012"
          test "$(sha256sum MILESTONE_33_CANDIDATE_INVESTIGATION_PLAN.md | cut -d' ' -f1)" \
            = "f833df6244a986ff6c42358a9d388bb7ffc13664518f31001cc188902752821f"
          git merge-base --is-ancestor \
            8b1481d6fbeed1bf3bf857b2954af80ef519014c "$GITHUB_SHA"

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Run fixed targeted morphology review
        run: |
          python scripts/m33_candidate_investigation.py \
            --config config/hd3651b_heldout_m33.json \
            --summary results_m33/search_summary.json \
            --data-dir data_m33_candidate_investigation \
            --output-dir results_m33_candidate_investigation \
            --extract \
            --date-utc 2026-08-26

      - name: Verify classifications and hash evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'results_m33_candidate_investigation/'
                  'candidate_investigation.json'
              ).read_text()
          )
          assert result['candidate_count'] == 1
          assert result['selected_frozen_dispositions'] == [
              'rfi_family_veto_pending_manual_review'
          ]
          allowed = {
              'RFI_OR_INSTRUMENTAL',
              'NOT_REPRODUCED_BY_LOCAL_TRACK_CHECK',
              'UNRESOLVED_REQUIRES_INDEPENDENT_CADENCE',
          }
          assert all(
              item['posthoc_classification'] in allowed
              for item in result['candidates']
          )
          archive = json.loads(
              Path(
                  'results_m33_candidate_investigation/'
                  'archive_cross_cadence_search.json'
              ).read_text()
          )
          assert archive['independent_cadence_found_by_prior_header_screen'] \
              is False
          PY
          find data_m33_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > DATA_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256
          find results_m33_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256
          test "$(wc -l < DATA_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256)" -eq 6
          test "$(wc -l < RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256)" -eq 4
          sha256sum -c RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256

      - name: Upload investigation evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-33-candidate-investigation
          if-no-files-found: error
          retention-days: 90
          path: |
            DATA_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256
            RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256
            results_m33_candidate_investigation/

      - name: Record provenance and publish checked investigation
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_33_CANDIDATE_INVESTIGATION_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'protocol_commit':
                          '8b1481d6fbeed1bf3bf857b2954af80ef519014c',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-33-candidate-investigation',
                      'candidate_count': 1,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty \
            results_m33_candidate_investigation/candidate_investigation.json \
            results_m33_candidate_investigation/archive_cross_cadence_search.json \
            MILESTONE_33_CANDIDATE_INVESTIGATION_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add DATA_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256 \
            RESULTS_MANIFEST_M33_CANDIDATE_INVESTIGATION.sha256 \
            results_m33_candidate_investigation \
            MILESTONE_33_CANDIDATE_INVESTIGATION_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 33 candidate investigation"
          git push origin HEAD:main
