name: LS7AC finite pointing study

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7ac_finite_pointing.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Evaluate frozen LS7AC
        run: python scripts/ls7ac_finite_pointing.py
      - name: Audit LS7AC independently
        run: python scripts/ls7ac_finite_pointing_audit.py
      - name: Rebuild manifest and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          out=Path('results_ls7ac_finite_pointing')
          files=sorted(p for p in out.iterdir() if p.is_file() and p.name!='SHA256SUMS')
          (out/'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
          git add results_ls7ac_finite_pointing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish audited LS7AC finite pointing result'
          git push origin HEAD:m43-support-qualification
