name: Milestone 28 held-out psi1 Dra B b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m28_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_28_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "1f7f0c2afca39eb10cbce270c1b7ac087d48bdccac6c8a1c61c0d2906567995c"
          test "$(sha256sum config/psi1drabb_heldout_m28.json | cut -d' ' -f1)" \
            = "a0c118cf0589d1edd23b550574dd22a5cfad1f8db9a3d5507aa4437085b16e79"
          test "$(sha256sum results_m28_selected_metadata/psi1drabb.json | cut -d' ' -f1)" \
            = "dc735eb5bd12b249240781ad757d284e1e637fca4f7b671652b0666348976110"
          test "$(sha256sum results_m28_preflight/coverage.json | cut -d' ' -f1)" \
            = "0a67dbd2cad1b40b23bb965a4e0f7161f014f49de862306dcc33a55405e32fc2"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m28.json
          python scripts/m14_coverage_preflight.py \
            config/psi1drabb_heldout_m28.json \
            --output results_m28/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m28
          python -m pip freeze > results_m28/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m28/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': '0e7a4bea59819b26d2b8a16375a43e40f836d27e',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': 'a0c118cf0589d1edd23b550574dd22a5cfad1f8db9a3d5507aa4437085b16e79',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/psi1drabb_heldout_m28.json \
            --data-dir data_m28

      - name: Hash extracted slices
        run: |
          find data_m28 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M28.sha256
          test "$(wc -l < DATA_MANIFEST_M28.sha256)" -eq 30

      - name: Run frozen detector v0.5.0 with complete cluster retention
        run: |
          seti-repeater search \
            --config config/psi1drabb_heldout_m28.json \
            --data-dir data_m28 \
            --output-dir results_m28

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m28/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1008
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m28 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M28.sha256
          test "$(wc -l < RESULTS_MANIFEST_M28.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M28.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-28-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m28.json
            DATA_MANIFEST_M28.sha256
            RESULTS_MANIFEST_M28.sha256
            results_m28/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_28_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit': '0e7a4bea59819b26d2b8a16375a43e40f836d27e',
                      'frozen_config_sha256': 'a0c118cf0589d1edd23b550574dd22a5cfad1f8db9a3d5507aa4437085b16e79',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-28-held-out-results',
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M28.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M28.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M28.sha256
          jq empty validation_m28.json \
            results_m28/search_summary.json \
            results_m28/completeness.json \
            results_m28/coverage_preflight_repeat.json \
            results_m28/run_metadata.json \
            MILESTONE_28_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m28.json \
            DATA_MANIFEST_M28.sha256 \
            RESULTS_MANIFEST_M28.sha256 \
            results_m28 \
            MILESTONE_28_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 28 result"
          git push origin HEAD:main
