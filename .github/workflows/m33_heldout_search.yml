name: Milestone 33 higher-smearing held-out HD 3651 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m33_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_33_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "4cea38dc401a475d759dc3b89e57269708d3185d1ce5798a3ebd95bd7a4c637a"
          test "$(sha256sum config/hd3651b_heldout_m33.json | cut -d' ' -f1)" \
            = "aaf4e2d53a4b95bb4428195d2567b9d3a8f8f60b62de104d8879c018b320971a"
          test "$(sha256sum results_m33_selected_metadata/hd3651b.json | cut -d' ' -f1)" \
            = "164167a8fc98574f76e0f7f0bfc4dd3479a61568a4d55daf0fa160209bd17ec6"
          test "$(sha256sum results_m33_preflight/coverage.json | cut -d' ' -f1)" \
            = "f72ac244af604b908ed641b41734212e56dc9dacff2c8246956e83f57545b47f"
          git merge-base --is-ancestor \
            e8f23e58e00cc57d26db03c06869ea3a2b06f5fa "$GITHUB_SHA"

      - name: Validate detector and repeat width-aware coverage proof
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 18.253611008 \
            --channel-width 2.7939677238464355 \
            --output validation_m33.json
          python scripts/m33_coverage_preflight.py \
            config/hd3651b_heldout_m33.json \
            --output results_m33/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m33
          python -m pip freeze > results_m33/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m33/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit':
                          '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit':
                          'e8f23e58e00cc57d26db03c06869ea3a2b06f5fa',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256':
                          'aaf4e2d53a4b95bb4428195d2567b9d3a8f8f60b62de104d8879c018b320971a',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd3651b_heldout_m33.json \
            --data-dir data_m33

      - name: Hash extracted slices
        run: |
          find data_m33 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M33.sha256
          test "$(wc -l < DATA_MANIFEST_M33.sha256)" -eq 30

      - name: Run frozen detector with complete wider-bank cluster retention
        run: |
          seti-repeater search \
            --config config/hd3651b_heldout_m33.json \
            --data-dir data_m33 \
            --output-dir results_m33

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m33/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          assert result['search_dimensions']['spectral_width_templates'] == [
              1, 3, 5, 9, 17, 33
          ]
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1512
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m33 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M33.sha256
          test "$(wc -l < RESULTS_MANIFEST_M33.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M33.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: milestone-33-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m33.json
            DATA_MANIFEST_M33.sha256
            RESULTS_MANIFEST_M33.sha256
            results_m33/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_33_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit':
                          'e8f23e58e00cc57d26db03c06869ea3a2b06f5fa',
                      'frozen_config_sha256':
                          'aaf4e2d53a4b95bb4428195d2567b9d3a8f8f60b62de104d8879c018b320971a',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-33-held-out-results',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M33.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M33.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M33.sha256
          jq empty validation_m33.json \
            results_m33/search_summary.json \
            results_m33/completeness.json \
            results_m33/coverage_preflight_repeat.json \
            results_m33/run_metadata.json \
            MILESTONE_33_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m33.json \
            DATA_MANIFEST_M33.sha256 \
            RESULTS_MANIFEST_M33.sha256 \
            results_m33 \
            MILESTONE_33_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 33 result"
          git push origin HEAD:main
