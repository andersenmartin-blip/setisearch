name: Milestone 32 publication verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m32_verify_publication.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify frozen inputs and all published file hashes
        run: |
          test "$(sha256sum MILESTONE_32_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "ebbe35fc48bcdbe179652edc9365312e4244a5927601143d21676a6ad6cbca42"
          test "$(sha256sum config/hd99492b_heldout_m32.json | cut -d' ' -f1)" \
            = "7f0f20f6e76f4182c9c9b94bb7ccca34c2d5345a459085362e480ef546732cf7"
          test "$(sha256sum results_m32_selected_metadata/hd99492b.json | cut -d' ' -f1)" \
            = "d17ebed8f9c0a5676a2140b36ba35424489acdd98fa9e936d80f23aa53c7f95b"
          test "$(sha256sum results_m32_preflight/coverage.json | cut -d' ' -f1)" \
            = "623874e1fdeac79308956186cfb056397b3f4c238743ffba9b55049c971dfe13"
          test "$(sha256sum results_m32/search_summary.json | cut -d' ' -f1)" \
            = "e7c0bef19a969589cbf5bec66a4342b845c174eb2be82d34d29f86a5cf649be3"
          test "$(sha256sum MILESTONE_32_REPORT.md | cut -d' ' -f1)" \
            = "79d65519b18fecd3c3d8b622e73b7c9942203dcc14bb7298fd62347734a1083e"
          test "$(wc -l < DATA_MANIFEST_M32.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M32.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M32.sha256
          git merge-base --is-ancestor \
            e96b2004799b557a2bee2c182193340825d1b957 "$GITHUB_SHA"

      - name: Independently verify result accounting and physical vetoes
        run: |
          python - <<'PY'
          import json
          import math
          from collections import Counter
          from pathlib import Path

          summary = json.loads(Path('results_m32/search_summary.json').read_text())
          complete = json.loads(Path('results_m32/completeness.json').read_text())
          repeated = json.loads(
              Path('results_m32/coverage_preflight_repeat.json').read_text()
          )
          validation = json.loads(Path('validation_m32.json').read_text())
          run_meta = json.loads(Path('results_m32/run_metadata.json').read_text())
          provenance = json.loads(
              Path('MILESTONE_32_HELDOUT_PROVENANCE.json').read_text()
          )
          config = json.loads(Path('config/hd99492b_heldout_m32.json').read_text())

          assert summary['pipeline']['version'] == '0.5.0'
          dimensions = summary['search_dimensions']
          assert dimensions['spectral_width_templates'] == [1, 3, 5, 9, 17, 33]
          assert dimensions['approx_nominal_trials'] == 888730920
          glob = summary['global_result']
          assert math.isclose(glob['observed_max_snr'], 3388.131144481915)
          assert math.isclose(
              glob['empirical_global_p_value'], 0.0038910505836575876
          )
          assert math.isclose(glob['null_median'], 8.965343952178955)
          assert math.isclose(
              glob['operational_threshold_snr'], 10.982738494873047
          )

          windows = summary['windows']
          expected = {
              'm32_1400p5': (64, 4, 3388.131144481915),
              'm32_1406p5': (25, 3, 1961.3011812829711),
              'm32_1412p5': (30, 0, 8.034787534671937),
              'm32_1418p5': (51, 4, 505.3503217783808),
              'm32_1425p0': (521, 3, 31.68056545290617),
          }
          threshold = glob['operational_threshold_snr']
          all_clusters = []
          above = []
          for window_id, (n_total, n_above, maximum) in expected.items():
              reduction = windows[window_id]['candidate_reduction']
              clusters = reduction['clusters']
              assert len(clusters) == n_total
              local_above = [c for c in clusters if c['max_snr'] >= threshold]
              assert len(local_above) == n_above
              assert math.isclose(max(c['max_snr'] for c in clusters), maximum)
              assert reduction['reported_cluster_count'] == n_total
              assert reduction['cluster_count_before_report_limit'] == n_total
              assert n_total <= 1512
              all_clusters.extend(clusters)
              above.extend(local_above)

          assert len(all_clusters) == 691
          assert len(above) == 14
          assert Counter(c['disposition'] for c in all_clusters) == Counter({
              'below_threshold': 677,
              'rfi_veto_off_source': 5,
              'rfi_veto_local_off_source': 7,
              'rfi_veto_receiver_frame_alias': 2,
          })
          assert Counter(c['disposition'] for c in above) == Counter({
              'rfi_veto_off_source': 5,
              'rfi_veto_local_off_source': 7,
              'rfi_veto_receiver_frame_alias': 2,
          })

          df_hz = abs(config['scans'][0]['expected_header']['foff_mhz']) * 1e6
          for cluster in above:
              disposition = cluster['disposition']
              if disposition == 'rfi_veto_off_source':
                  assert 'off_source_coincidence' in cluster['flags']
                  assert cluster['off_at_best_hypothesis_snr'] >= threshold
              elif disposition == 'rfi_veto_local_off_source':
                  assert 'off_source_local_hypothesis_coincidence' in cluster['flags']
                  diag = cluster['v0p5_off_diagnostics']
                  local = diag['best_local_recurrence']
                  assert abs(local['offset_from_candidate_hz']) <= \
                      diag['local_tolerance_bins'] * df_hz + 1e-6
                  assert local['snr'] >= threshold
              else:
                  assert disposition == 'rfi_veto_receiver_frame_alias'
                  assert 'receiver_frame_template_alias' in cluster['flags']
                  aliases = cluster['v0p5_receiver_frame_aliases']
                  assert aliases
                  assert all(len(a['matched_active_epochs']) >= 2 for a in aliases)
                  assert all(
                      abs(epoch['delta_hz']) <= 20
                      for alias in aliases
                      for epoch in alias['matched_active_epochs']
                  )

          strongest = max(above, key=lambda c: c['max_snr'])
          assert math.isclose(
              strongest['cluster_frequency_mhz'], 1400.1677697332489
          )
          assert strongest['disposition'] == 'rfi_veto_local_off_source'
          assert strongest['best_hypothesis']['template_index'] == 19
          assert strongest['best_hypothesis']['spectral_width_channels'] == 33
          assert strongest['best_hypothesis']['active_epochs_zero_based'] == [0, 2]
          local = strongest['v0p5_off_diagnostics']['best_local_recurrence']
          assert math.isclose(local['snr'], 8289.641362592643)
          assert math.isclose(
              local['offset_from_candidate_hz'], 2.8355034373817034
          )

          levels = complete['levels']
          assert [x['ideal_single_epoch_snr'] for x in levels] == [
              8, 12, 16, 20, 24, 32, 40
          ]
          assert [x['multi_channel_recovered'] for x in levels] == [
              0, 2, 18, 28, 32, 32, 32
          ]
          assert [x['one_channel_recovered'] for x in levels] == [
              0, 2, 8, 10, 13, 20, 26
          ]
          assert all(x['trials'] == 32 for x in levels)
          assert config['search']['spectral_widths_channels'] == [
              1, 3, 5, 9, 17, 33
          ]
          assert config['search']['scramble_seed'] == 3220260825
          assert config['search']['completeness']['seed'] == 322120260825

          assert repeated['passed'] is True
          assert repeated['checks'] == 630
          assert repeated['spectral_width_bank_channels'] == [1, 3, 5, 9, 17, 33]
          assert repeated['spectral_half_width_channels'] == 16
          assert repeated['spectral_payload_inspected'] is False
          assert repeated['remote_files_opened'] is False
          assert validation['software_version'] == '0.5.0'
          assert validation['known_answer']['passed'] is True
          assert validation['known_answer']['multi_channel_known_answer']['passed'] is True
          assert run_meta['preregistration_commit'] == \
              '1007a4de4e40834b8665489922f2add3f45940d0'
          assert run_meta['execution_commit'] == \
              'd35d908de39801a5e75d22e966658ce255db1170'
          assert provenance['github_run_id'] == 32873831269
          assert provenance['artifact_id'] == 9573919417
          assert provenance['artifact_digest'] == \
              '4c71d568c228a634c6deb3456ec3461266f3e5e4a483ccc075e4d80bace2411e'
          PY

      - name: Append verification and create machine-readable receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = Path('MILESTONE_32_REPORT.md')
          source_hash = hashlib.sha256(report.read_bytes()).hexdigest()
          assert source_hash == \
              '79d65519b18fecd3c3d8b622e73b7c9942203dcc14bb7298fd62347734a1083e'
          run_id = int(os.environ['GITHUB_RUN_ID'])
          report.write_text(
              report.read_text()
              .replace(
                  'Publication verification is appended after an independent workflow has\n'
                  'revalidated the result hashes, complete cluster accounting, every\n'
                  'above-threshold physical veto, execution provenance, and this report.\n',
                  f'Publication verification workflow run `{run_id}` independently '
                  'revalidated all nine result-file hashes, complete accounting for '
                  '691 clusters, all 14 above-threshold physical vetoes, the six-width '
                  'bank and known-answer tests, discrete local-tolerance handling, '
                  'execution provenance, and the pre-verification report hash. Its '
                  'machine-readable receipt is '
                  '`MILESTONE_32_PUBLICATION_VERIFICATION.json`.\n',
              )
          )
          final_hash = hashlib.sha256(report.read_bytes()).hexdigest()
          receipt = {
              'verified': True,
              'verified_utc': datetime.now(timezone.utc).isoformat(),
              'github_run_id': run_id,
              'run_url': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f'/actions/runs/{run_id}'
              ),
              'source_commit': os.environ['GITHUB_SHA'],
              'source_report_sha256': source_hash,
              'report_sha256_after_verification': final_hash,
              'search_summary_sha256':
                  'e7c0bef19a969589cbf5bec66a4342b845c174eb2be82d34d29f86a5cf649be3',
              'results_manifest_sha256': hashlib.sha256(
                  Path('RESULTS_MANIFEST_M32.sha256').read_bytes()
              ).hexdigest(),
              'data_manifest_entries_verified': 30,
              'result_files_verified': 9,
              'reported_clusters_verified': 691,
              'over_threshold_clusters_verified': 14,
              'matched_control_vetoes_verified': 5,
              'local_control_vetoes_verified': 7,
              'receiver_alias_vetoes_verified': 2,
              'spectral_width_templates_verified': [1, 3, 5, 9, 17, 33],
              'surviving_candidates_verified': 0,
          }
          Path('MILESTONE_32_PUBLICATION_VERIFICATION.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Publish verified report and receipt
        run: |
          jq -e '.verified == true and .surviving_candidates_verified == 0' \
            MILESTONE_32_PUBLICATION_VERIFICATION.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add MILESTONE_32_REPORT.md \
            MILESTONE_32_PUBLICATION_VERIFICATION.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "m32: record verified result publication"
          git push origin HEAD:main
