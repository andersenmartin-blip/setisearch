name: Milestone 32 HD 99492 b higher-smearing coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m32_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_32_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "426de94010d32e308624ce29c8c65f1b3931e3ea6d69c233baeeb6a343167d96"
          test "$(sha256sum results_m32_selected_metadata/hd99492b.json | cut -d' ' -f1)" \
            = "d17ebed8f9c0a5676a2140b36ba35424489acdd98fa9e936d80f23aa53c7f95b"
          test "$(sha256sum config/hd99492b_m32_preflight.json | cut -d' ' -f1)" \
            = "a5cc99ad8ebe7a7f1b99a8a1aff08496ecb723404b90f476c65b75eff5480a15"
          test "$(sha256sum scripts/m32_coverage_preflight.py | cut -d' ' -f1)" \
            = "342fbab38e256810ab4744321d0ad0f07cd89e6534c63133a7acc4b4b7d13217"
          git merge-base --is-ancestor \
            6b3d31a2a013bd88dcba05cce9101e785b87ec89 "$GITHUB_SHA"

      - name: Run metadata-only motion and width-bank coverage proof
        run: |
          python scripts/m32_coverage_preflight.py \
            config/hd99492b_m32_preflight.json \
            --output results_m32_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m32_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_width_bank_channels'] == [1, 3, 5, 9, 17, 33]
          assert result['spectral_half_width_channels'] == 16
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m32_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256
          test "$(wc -l < RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-32-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256
            results_m32_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_32_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-32-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                      'spectral_width_bank_channels': [1, 3, 5, 9, 17, 33],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m32_preflight/coverage.json \
            MILESTONE_32_COVERAGE_PREFLIGHT_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M32_COVERAGE_PREFLIGHT.sha256 \
            results_m32_preflight \
            MILESTONE_32_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 32 coverage preflight"
          git push origin HEAD:main
