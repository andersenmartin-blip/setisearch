name: Milestone 16 HD 219134 independent-cadence follow-up

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m16_independent_followup.yml"

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify frozen inputs and independent-cadence protocol
        run: |
          test "$(sha256sum config/hd219134h_m16_independent_followup.json | cut -d' ' -f1)" \
            = "2ce40ea883f932766aeb0147b283d117fd0657a1dcb28811b12a3d0658c5d319"
          test "$(sha256sum scripts/m16_independent_cadence_followup.py | cut -d' ' -f1)" \
            = "b477c2e6dae5811322a3c550b55a9723bec2df48609508f091cfe7221aa87e93"
          test "$(sha256sum MILESTONE_16_INDEPENDENT_CADENCE_PLAN.md | cut -d' ' -f1)" \
            = "aecdae1b3ccc98106b31fc59116b6748d6352537764433810017664751f189d2"
          test "$(sha256sum results_m16_candidate_investigation/candidate_investigation.json | cut -d' ' -f1)" \
            = "ad408be5061e2f1272469cac03c81e1781e93d2c9bf22afaa18113ee4538ce6f"
          test "$(sha256sum results_m16_header_screen_corrected/header_screen.json | cut -d' ' -f1)" \
            = "c441713192397b1e7cbf4565a8ef26c57406c436f8cac1833f7cb54ca6342333"

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Run frozen independent-cadence recurrence test
        run: |
          python scripts/m16_independent_cadence_followup.py \
            --config config/hd219134h_m16_independent_followup.json \
            --investigation results_m16_candidate_investigation/candidate_investigation.json \
            --data-dir data_m16_independent_followup \
            --output-dir results_m16_independent_followup \
            --extract

      - name: Hash extracted slices and results
        run: |
          find data_m16_independent_followup -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256
          find results_m16_independent_followup -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256
          test "$(wc -l < DATA_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256)" -eq 12
          test "$(wc -l < RESULTS_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256)" -eq 4

      - name: Upload independent-cadence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-16-independent-followup
          if-no-files-found: warn
          retention-days: 90
          path: |
            DATA_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256
            RESULTS_MANIFEST_M16_INDEPENDENT_FOLLOWUP.sha256
            results_m16_independent_followup/
