name: Milestone 36 high-smearing held-out HIP 48714 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m36_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_36_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "b76c03be951e04f57ab0da4193094319e5a66558755477bc80b5a2a89a8fb9f7"
          test "$(sha256sum config/hip48714b_heldout_m36.json | cut -d' ' -f1)" \
            = "b2c483a9db4075524319a0cd8e336969de4556bd0f9e5b66266a0b687f84b43c"
          test "$(sha256sum results_m36_selected_metadata/hip48714b.json | cut -d' ' -f1)" \
            = "787f0d5a905e0f6f54aaffea6cb4c2af68183888bbdb4a5a026b5899fe81bc04"
          test "$(sha256sum results_m36_preflight/coverage.json | cut -d' ' -f1)" \
            = "a6bc77011756f47ca139a933c5eba64c2858dce6b0351eb2f2659f376ec541c0"
          test "$(sha256sum scripts/m36_coverage_preflight.py | cut -d' ' -f1)" \
            = "587fa8b25a06754e29b1434f29180c7fc57e5161b5846beb524b362375b4cb7d"
          git merge-base --is-ancestor \
            c17f362028132629b5fbcc9b1c47001acc934e6f "$GITHUB_SHA"

      - name: Validate detector, widest width, and repeat coverage proof
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 18.253611008 \
            --channel-width 2.7939677238464355 \
            --output validation_m36.json
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np

          from seti_repeater.search import make_subsets, make_templates
          from seti_repeater.spectral import make_spectral_bank, validate_widths

          config = json.loads(
              Path('config/hip48714b_heldout_m36.json').read_text()
          )
          templates = make_templates(config)
          subsets = make_subsets(
              3, config['search']['minimum_active_epochs']
          )
          widths = validate_widths(
              config['search']['spectral_widths_channels']
          )
          maximum = (
              len(templates)
              * len(subsets)
              * len(widths)
              * config['search']['candidate_reporting'][
                  'peaks_per_hypothesis'
              ]
          )
          assert len(templates) == 21
          assert len(subsets) == 4
          assert widths == (1, 3, 5, 9, 17, 33, 65, 129)
          assert maximum == 2016
          assert config['search']['candidate_reporting'][
              'max_report_clusters'
          ] == 2200
          vectors = np.zeros((len(templates), 3, 257), dtype=np.float32)
          vectors[0, 0, 64:193] = 1.0
          vectors[1, 0, 111:146] = 1.0
          bank = make_spectral_bank(vectors, widths)
          assert bank.shape == (8, 21, 3, 257)
          widest_responses = bank[:, 0, 0, 128]
          selected_responses = bank[:, 1, 0, 128]
          assert int(np.argmax(widest_responses)) == widths.index(129)
          assert np.isclose(widest_responses[-1], np.sqrt(129))
          assert int(np.argmax(selected_responses)) == widths.index(33)
          PY
          python scripts/m36_coverage_preflight.py \
            config/hip48714b_heldout_m36.json \
            --output results_m36/coverage_preflight_repeat.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m36/coverage_preflight_repeat.json').read_text()
          )
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_width_bank_channels'] == [
              1, 3, 5, 9, 17, 33, 65, 129
          ]
          assert result['spectral_half_width_channels'] == 64
          assert result['maximum_hypothesis_peaks_per_window'] == 2016
          assert result['candidate_report_cap'] == 2200
          assert result['candidate_report_cap_nontruncating'] is True
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY

      - name: Record execution environment
        run: |
          mkdir -p results_m36
          python -m pip freeze > results_m36/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m36/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit':
                          '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit':
                          'c17f362028132629b5fbcc9b1c47001acc934e6f',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256':
                          'b2c483a9db4075524319a0cd8e336969de4556bd0f9e5b66266a0b687f84b43c',
                      'high_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33, 65, 129
                      ],
                      'maximum_hypothesis_peaks_per_window': 2016,
                      'candidate_report_cap': 2200,
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hip48714b_heldout_m36.json \
            --data-dir data_m36

      - name: Hash extracted slices
        run: |
          find data_m36 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M36.sha256
          test "$(wc -l < DATA_MANIFEST_M36.sha256)" -eq 30

      - name: Run frozen detector with complete high-smearing retention
        run: |
          seti-repeater search \
            --config config/hip48714b_heldout_m36.json \
            --data-dir data_m36 \
            --output-dir results_m36

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m36/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          assert result['search_dimensions']['spectral_width_templates'] == [
              1, 3, 5, 9, 17, 33, 65, 129
          ]
          assert result['search_dimensions']['templates'] == 21
          assert result['search_dimensions']['epoch_subsets'] == 4
          assert result['search_dimensions']['approx_nominal_trials'] == \
              1_202_587_680
          assert result['candidate_reduction']['settings'][
              'max_report_clusters'
          ] == 2200
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 2016
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m36 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M36.sha256
          test "$(wc -l < RESULTS_MANIFEST_M36.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M36.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-36-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m36.json
            DATA_MANIFEST_M36.sha256
            RESULTS_MANIFEST_M36.sha256
            results_m36/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_36_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit':
                          'c17f362028132629b5fbcc9b1c47001acc934e6f',
                      'frozen_config_sha256':
                          'b2c483a9db4075524319a0cd8e336969de4556bd0f9e5b66266a0b687f84b43c',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-36-held-out-results',
                      'high_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33, 65, 129
                      ],
                      'maximum_hypothesis_peaks_per_window': 2016,
                      'candidate_report_cap': 2200,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M36.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M36.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M36.sha256
          jq empty validation_m36.json \
            results_m36/search_summary.json \
            results_m36/completeness.json \
            results_m36/coverage_preflight_repeat.json \
            results_m36/run_metadata.json \
            MILESTONE_36_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m36.json \
            DATA_MANIFEST_M36.sha256 \
            RESULTS_MANIFEST_M36.sha256 \
            results_m36 \
            MILESTONE_36_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 36 result"
          git push origin HEAD:main
