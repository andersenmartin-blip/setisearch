name: Milestone 23 held-out HD 33564 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m23_heldout_search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_23_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "63af84f232dc58a75e832e488047051ea3883705ee6c63912ee757f5d87710b9"
          test "$(sha256sum config/hd33564b_heldout_m23.json | cut -d' ' -f1)" \
            = "c36f73c812d4d863e059979573775aac20ef5a2ec38aafc30b9c2abe2629edf7"
          test "$(sha256sum results_m23_selected_metadata/hd33564b.json | cut -d' ' -f1)" \
            = "e163f34283a33a863d6c1487f713906cd7ffd48a7c8c864b43530abc48b25d05"
          test "$(sha256sum results_m23_preflight/coverage.json | cut -d' ' -f1)" \
            = "977df9fd4615245fcad9206ce611c78c228b00a05eca308f2339027e15acee52"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m23.json
          python scripts/m14_coverage_preflight.py \
            config/hd33564b_heldout_m23.json \
            --output results_m23/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m23
          python -m pip freeze > results_m23/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m23/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': '4ddb99fe875e846bc012b40f68741a9f3b3d7e95',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': 'c36f73c812d4d863e059979573775aac20ef5a2ec38aafc30b9c2abe2629edf7',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd33564b_heldout_m23.json \
            --data-dir data_m23

      - name: Hash extracted slices
        run: |
          find data_m23 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M23.sha256
          test "$(wc -l < DATA_MANIFEST_M23.sha256)" -eq 30

      - name: Run frozen detector v0.5.0
        run: |
          seti-repeater search \
            --config config/hd33564b_heldout_m23.json \
            --data-dir data_m23 \
            --output-dir results_m23

      - name: Hash primary results
        run: |
          find results_m23 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M23.sha256

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-23-held-out-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation_m23.json
            DATA_MANIFEST_M23.sha256
            RESULTS_MANIFEST_M23.sha256
            results_m23/
