name: Milestone 29 HD 11964 candidate investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m29_candidate_investigation.yml"

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify frozen inputs and investigation protocol
        run: |
          test "$(sha256sum config/hd11964b_heldout_m29.json | cut -d' ' -f1)" \
            = "d5e6da15f512957e1395fd201636fdc944d35e1c2fc99c70bed33ad10dc7a203"
          test "$(sha256sum results_m29/search_summary.json | cut -d' ' -f1)" \
            = "6537513cfc08f875328b9fc7887e95a1d130adbad5c14ebc2409b59d316d6ad9"
          test "$(sha256sum scripts/m11_candidate_investigation.py | cut -d' ' -f1)" \
            = "6565eb733fb5b3011564a8e98fce32c907aa90ab3890cfb7e9400c4c6419d2cb"
          test "$(sha256sum scripts/m29_candidate_investigation.py | cut -d' ' -f1)" \
            = "58e8880e3f6b77eac3a478c6cee3e6ae65792b6d9661a92dc302f256581497c0"
          test "$(sha256sum MILESTONE_29_CANDIDATE_INVESTIGATION_PLAN.md | cut -d' ' -f1)" \
            = "831dfacc768544a3292ce8254fdfff5c87d0168845ca3407476eb905eb922164"

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Run fixed targeted morphology review
        run: |
          python scripts/m29_candidate_investigation.py \
            --config config/hd11964b_heldout_m29.json \
            --summary results_m29/search_summary.json \
            --data-dir data_m29_candidate_investigation \
            --output-dir results_m29_candidate_investigation \
            --extract \
            --date-utc 2026-08-24

      - name: Verify classifications and hash evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'results_m29_candidate_investigation/'
                  'candidate_investigation.json'
              ).read_text()
          )
          assert result['candidate_count'] == 2
          assert result['selected_frozen_dispositions'] == [
              'rfi_family_veto_pending_manual_review'
          ]
          allowed = {
              'RFI_OR_INSTRUMENTAL',
              'NOT_REPRODUCED_BY_LOCAL_TRACK_CHECK',
              'UNRESOLVED_REQUIRES_INDEPENDENT_CADENCE',
          }
          assert all(
              item['posthoc_classification'] in allowed
              for item in result['candidates']
          )
          archive = json.loads(
              Path(
                  'results_m29_candidate_investigation/'
                  'archive_cross_cadence_search.json'
              ).read_text()
          )
          assert archive['independent_cadence_found_by_prior_header_screen'] \
              is False
          PY
          find data_m29_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > DATA_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256
          find results_m29_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256
          test "$(wc -l < DATA_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256)" -eq 6
          test "$(wc -l < RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256)" -eq 5
          sha256sum -c RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256

      - name: Upload investigation evidence
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: milestone-29-candidate-investigation
          if-no-files-found: error
          retention-days: 90
          path: |
            DATA_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256
            RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256
            results_m29_candidate_investigation/

      - name: Record provenance and publish checked investigation
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_29_CANDIDATE_INVESTIGATION_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'protocol_commit':
                          '353b0dcf0a6bcb312bc1bb2ba8c4715d6576ea0e',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-29-candidate-investigation',
                      'candidate_count': 2,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty \
            results_m29_candidate_investigation/candidate_investigation.json \
            results_m29_candidate_investigation/archive_cross_cadence_search.json \
            MILESTONE_29_CANDIDATE_INVESTIGATION_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add DATA_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256 \
            RESULTS_MANIFEST_M29_CANDIDATE_INVESTIGATION.sha256 \
            results_m29_candidate_investigation \
            MILESTONE_29_CANDIDATE_INVESTIGATION_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 29 candidate investigation"
          git push origin HEAD:main
