name: LS8E metadata-only independent target selection

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8e_select.yml'

permissions:
  contents: write

concurrency:
  group: ls8e-metadata-selection
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FROZEN: 2e69c214016f7ef4bb18b27c49104951a9eb168f
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Run frozen known-answer selection tests
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls8e "$FROZEN"
          test "$(git -C /tmp/ls8e rev-parse HEAD)" = "$FROZEN"
          cd /tmp/ls8e
          python -m unittest tests.test_ls8e_selection -v 2>&1 | tee /tmp/ls8e_tests.log
      - name: Query public CHEOPS metadata only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'dace-query==3.0.1'
          cd /tmp/ls8e
          python -u scripts/ls8e_select_target.py 2>&1 | tee /tmp/ls8e_run.log
          cp /tmp/ls8e_tests.log results_ls8e_selection/TESTS.log
          cp /tmp/ls8e_run.log results_ls8e_selection/RUN.log
          python -m pip freeze > results_ls8e_selection/environment.txt
      - name: Enforce metadata-only boundary and mechanical result
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8e
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out=Path('results_ls8e_selection')
          r=json.loads((out/'selection.json').read_text())
          assert r['science_product_bytes_read']==0
          assert r['fits_table_rows_read']==0
          assert r['image_pixels_read']==0
          assert r['lightcurve_values_read']==0
          assert r['product_download_calls']==0
          assert r['status'] in {'SELECTED','NO_ELIGIBLE_TARGET_IN_FROZEN_LIST'}
          if r['status']=='SELECTED':
              s=r['selection']
              assert s is not None
              assert s['target']!='55 Cnc'
              assert len(s['selected_visits'])==2
              starts=[float(x['date_mjd_start']) for x in s['selected_visits']]
              assert starts==sorted(starts)
              for v in s['selected_visits']:
                  assert v['eligible'] is True
                  p=v['products']
                  assert p['has_default_lightcurve']
                  assert p['has_cal_subarray']
                  assert p['has_cor_subarray']
          rows=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS'):
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n')
          (out/'SHA256SUMS').write_text(''.join(rows))
          PY
          (cd results_ls8e_selection && sha256sum -c SHA256SUMS)
      - name: Publish LS8E metadata selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C /tmp/ls8e rev-parse HEAD)" = "$FROZEN"
          rm -rf results_ls8e_selection
          cp -a /tmp/ls8e/results_ls8e_selection .
          git add results_ls8e_selection
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish metadata-only LS8E target selection'
          git push origin HEAD:m43-support-qualification
