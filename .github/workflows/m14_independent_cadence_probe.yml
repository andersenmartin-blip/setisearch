name: Milestone 14 independent-cadence metadata probe

on:
  pull_request:
    paths:
      - ".github/workflows/m14_independent_cadence_probe.yml"
      - "m14-independent-cadence-trigger.md"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install metadata adapters
        run: |
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Enumerate and inspect GJ 687 cadence metadata
        run: |
          python scripts/m13_catalog_probe.py \
            --target-id gj_687 \
            --nasa-host 'GJ 687' \
            --max-records-per-query 300 \
            --max-cadences-per-alias 10 \
            --probe-cadence-hdf5-headers \
            --output results_m14_independent_cadence/metadata_probe.json

      - name: Enforce metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('results_m14_independent_cadence/metadata_probe.json')
          record = json.loads(path.read_text())
          assert record['spectral_payload_inspected'] is False
          headers = []
          for target in record['targets']:
              for alias in target['aliases']:
                  for cadence in alias['cadences_inspected']:
                      headers.extend(cadence['hdf5_headers'])
          assert headers, 'No HDF5 headers were inspected'
          assert all(item['spectral_dataset_values_read'] is False for item in headers)
          print(json.dumps({
              'hdf5_headers': len(headers),
              'error_count': sum('error' in item for item in headers),
              'sources': sorted({item.get('source_name') for item in headers}),
          }, indent=2))
          PY

      - name: Hash metadata evidence
        run: |
          sha256sum results_m14_independent_cadence/metadata_probe.json \
            > RESULTS_MANIFEST_M14_INDEPENDENT_CADENCE_METADATA.sha256

      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-14-independent-cadence-metadata
          if-no-files-found: warn
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M14_INDEPENDENT_CADENCE_METADATA.sha256
            results_m14_independent_cadence/metadata_probe.json
