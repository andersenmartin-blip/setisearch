name: LS8AI EC13080-1508 DEFAULT L2 header preflight

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8ai_l2_metadata.yml'

permissions:
  contents: write

concurrency:
  group: ls8ai-metadata
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 astropy==7.0.2
      - name: Exact header-only preflight
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ls8w_url_timeout -v 2>&1 | tee /tmp/ls8ai_transport_tests.log
          python -u scripts/ls8ai_l2_metadata.py 2>&1 | tee /tmp/ls8ai_metadata.log
      - name: Preserve header result
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.metadata.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_ls8ai_l2_metadata
          if test -f /tmp/ls8ai_metadata.log; then cp /tmp/ls8ai_metadata.log results_ls8ai_l2_metadata/RUN.log; fi
          if test -f /tmp/ls8ai_transport_tests.log; then cp /tmp/ls8ai_transport_tests.log results_ls8ai_l2_metadata/transport_tests.log; fi
          python -m pip freeze | sort > results_ls8ai_l2_metadata/environment.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('results_ls8ai_l2_metadata')
          result=out/'summary.json'
          status=json.loads(result.read_text())['status'] if result.exists() else 'INCOMPLETE'
          (out/'RUN_STATUS.json').write_text(json.dumps({'execution_outcome':os.environ['RUN_OUTCOME'],'scientific_status':status,'freeze_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          git add results_ls8ai_l2_metadata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish LS8AI exact EC13080-1508 header metadata'
          git push origin HEAD:m43-support-qualification
      - name: Require successful metadata gate
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.metadata.outcome }}
        run: test "$RUN_OUTCOME" = success
