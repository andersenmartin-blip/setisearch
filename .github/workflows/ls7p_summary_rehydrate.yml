name: LS7P exact summary rehydration

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7p_summary_rehydrate.yml'

permissions:
  contents: write

jobs:
  rehydrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
      FROZEN: f42aa216b25779d55cd1fabd25545d3277abcfa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Recreate summary files with frozen preflight response
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls7p-frozen "$FROZEN"
          cp -a results_ls7p_inputs /tmp/ls7p-frozen/
          cd /tmp/ls7p-frozen
          python -m pip install -r requirements_ls7g.txt
          rm -rf results_ls7p_response
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('/tmp/ls7p-frozen')
          sys.path.insert(0,str(root/'src')); sys.path.insert(0,str(root/'scripts'))
          import ls7p_evaluate as p
          frozen=json.loads((root/'results_ls7p_preflight/calibration_response.json').read_text())['models']
          p.calibration=lambda cfg, metadata: frozen
          p.main()
          import ls7p_audit as a
          a.main()
          PY
      - name: Require exact approved summary blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls7p-frozen
          cat > /tmp/expected.txt <<'EOF'
          dd4b48f22a13e9c75cc24fd2afe0d191128eaf7d results_ls7p_response/SHA256SUMS
          d0a301480f47d61a7859aef50e5296886a9e56b6 results_ls7p_response/audit.json
          4d93d7907153d0dd8f6d0085f4483c104cd93de5 results_ls7p_response/calibration_response.json
          362b7fbb62c1b382c2b78bc3588d02713dc6f897 results_ls7p_response/summary.json
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "blob mismatch: $path $actual != $expected"; exit 1; }
          done < /tmp/expected.txt
      - name: Publish exact summary files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ls7p-frozen/results_ls7p_response/{SHA256SUMS,audit.json,calibration_response.json,summary.json} results_ls7p_response/
          git add results_ls7p_response/{SHA256SUMS,audit.json,calibration_response.json,summary.json}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact LS7P summary and audit objects'
          git push origin HEAD:m43-support-qualification
