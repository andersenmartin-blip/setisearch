name: Milestone 18 held-out GJ 649 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m18_heldout_search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum config/gj649b_heldout_m18.json | cut -d' ' -f1)" \
            = "1dfe92deb385aa39f83af8b1c3c59f01ff8bc405c0c3b0c8671cc57307fd5783"
          test "$(sha256sum results_m18_selected_metadata/gj649b.json | cut -d' ' -f1)" \
            = "d1b5bd595bd69ba66250d82aff69d348d8f88cda95d3a43cccb6012e95d8716d"
          test "$(sha256sum results_m18_preflight/coverage.json | cut -d' ' -f1)" \
            = "1bc38620aaaf3def0c2ec3d6fbfd742508f066909b1292f1358ad90880c5c42c"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m18.json
          python scripts/m14_coverage_preflight.py \
            config/gj649b_heldout_m18.json \
            --output results_m18/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m18
          python -m pip freeze > results_m18/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m18/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': '1dfe92deb385aa39f83af8b1c3c59f01ff8bc405c0c3b0c8671cc57307fd5783',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/gj649b_heldout_m18.json \
            --data-dir data_m18

      - name: Hash extracted slices
        run: |
          find data_m18 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M18.sha256
          test "$(wc -l < DATA_MANIFEST_M18.sha256)" -eq 30

      - name: Run frozen detector v0.5.0
        run: |
          seti-repeater search \
            --config config/gj649b_heldout_m18.json \
            --data-dir data_m18 \
            --output-dir results_m18

      - name: Hash primary results
        run: |
          find results_m18 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M18.sha256

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-18-held-out-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation_m18.json
            DATA_MANIFEST_M18.sha256
            RESULTS_MANIFEST_M18.sha256
            results_m18/
