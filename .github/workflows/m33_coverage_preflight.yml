name: Milestone 33 HD 3651 b higher-smearing coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m33_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_33_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "a83bcbfb3ff5b583b673bb65e7f675161cc9fb706c2b77b53df27ccee578be26"
          test "$(sha256sum results_m33_selected_metadata/hd3651b.json | cut -d' ' -f1)" \
            = "164167a8fc98574f76e0f7f0bfc4dd3479a61568a4d55daf0fa160209bd17ec6"
          test "$(sha256sum config/hd3651b_m33_preflight.json | cut -d' ' -f1)" \
            = "4ac6bb38a97674b35f0cffb4f0f3856f4ee0b3fee0c375898dab6e0335c70273"
          test "$(sha256sum scripts/m33_coverage_preflight.py | cut -d' ' -f1)" \
            = "ee24d95c9e7490c7fb2cf3757567d5e463a040f23ea3453cafc2403451d02104"
          git merge-base --is-ancestor \
            dc998376b9687e5c517fd674044e768083f1f506 "$GITHUB_SHA"

      - name: Run metadata-only motion and width-bank coverage proof
        run: |
          python scripts/m33_coverage_preflight.py \
            config/hd3651b_m33_preflight.json \
            --output results_m33_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m33_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_width_bank_channels'] == [1, 3, 5, 9, 17, 33]
          assert result['spectral_half_width_channels'] == 16
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m33_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256
          test "$(wc -l < RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-33-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256
            results_m33_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_33_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-33-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                      'spectral_width_bank_channels': [1, 3, 5, 9, 17, 33],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m33_preflight/coverage.json \
            MILESTONE_33_COVERAGE_PREFLIGHT_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M33_COVERAGE_PREFLIGHT.sha256 \
            results_m33_preflight \
            MILESTONE_33_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 33 coverage preflight"
          git push origin HEAD:main
