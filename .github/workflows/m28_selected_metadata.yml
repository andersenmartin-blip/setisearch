name: Milestone 28 psi1 Dra B selected-target metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m28_selected_metadata.yml"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen selection inputs and metadata query
        run: |
          test "$(sha256sum results_m16_discovery/discovery.json | cut -d' ' -f1)" \
            = "0310d5ba8e0923062bd0a046b1827a4e814fc3f3adf854620d27e3cccb7fd750"
          test "$(sha256sum results_m25_header_screen/header_screen.json | cut -d' ' -f1)" \
            = "f9d3b2b75cb6bb49a278b7b97f1d2163d03f054282b0e5904ed6fffe15756748"
          test "$(sha256sum MILESTONE_28_TARGET_SELECTION.md | cut -d' ' -f1)" \
            = "95adf5e795fcf0a891b1d89362ff46fedfeca599114b7a5c1c8711ffaf521b5e"
          test "$(sha256sum scripts/m28_selected_metadata.py | cut -d' ' -f1)" \
            = "66f175bcae76a2cb044cb3a5eed5f7b66cc63cc232e3883466e9a927a0d82280"

      - name: Verify mechanical psi1 Dra B selection and spectral boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          screen = json.loads(
              Path('results_m25_header_screen/header_screen.json').read_text()
          )
          targets = {item['rank']: item for item in screen['screened_targets']}
          assert screen['selected']['rank'] == 21
          target = targets[24]
          assert target['archive_target'] == 'HIP86620'
          assert target['planet_name'] == 'psi1 Dra B b'
          assert target['qualifying_count'] == 1
          assert targets[25]['qualifying_count'] == 0
          primary = target['qualifying_hdf5_abacad_cadences'][0]
          assert primary['cadence_url'].endswith('/--84027')
          assert len(primary['headers']) == 6
          assert primary['scan_sources'] == [
              'HIP86620', 'HIP86620_OFF', 'HIP86620',
              'HIP86620_OFF', 'HIP86620', 'HIP86620_OFF'
          ]
          assert all(
              header['spectral_dataset_values_read'] is False
              for header in primary['headers']
          )
          PY

      - name: Fetch selected official record
        run: python scripts/m28_selected_metadata.py

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m28_selected_metadata/psi1drabb.json').read_text()
          )
          assert result['spectral_payload_inspected'] is False
          assert result['record']['pl_name'] == 'psi1 Dra B b'
          assert result['record']['hostname'] == 'psi1 Dra B'
          assert result['record']['hip_name'] == 'HIP 86620'
          assert result['record']['hd_name'] == 'HD 162004'
          PY
          find results_m28_selected_metadata -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M28_SELECTED_METADATA.sha256

      - name: Upload selected metadata
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-28-selected-metadata
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M28_SELECTED_METADATA.sha256
            results_m28_selected_metadata/

      - name: Record provenance and publish checked metadata
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_28_SELECTED_METADATA_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'github_sha': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-28-selected-metadata',
                      'spectral_payload_inspected': False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          git add RESULTS_MANIFEST_M28_SELECTED_METADATA.sha256 \
            results_m28_selected_metadata \
            MILESTONE_28_SELECTED_METADATA_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 28 selected metadata"
          git push origin HEAD:main
