name: LS2B dedicated cadence discovery

on:
  workflow_dispatch:
  push:
    branches: [ls2b-cadence-discovery]
    paths:
      - ".github/workflows/ls2b_cadence_discovery.yml"
      - "LS2B_CADENCE_DISCOVERY_PLAN.md"
      - "LS2B_CADENCE_FREEZE.sha256"
      - "config/ls2b_cadence_discovery.json"
      - "scripts/ls2b_cadence_discovery.py"
      - "tests/test_ls2b_cadence_discovery.py"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require unpublished LS2B result boundary
        run: |
          test ! -e results_ls2b_cadence/cadences.json
          test ! -e LS2B_CADENCE_RESULT.md
          test ! -e RESULTS_MANIFEST_LS2B_CADENCE.sha256
          test ! -e LS2B_CADENCE_PROVENANCE.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify frozen metadata implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'pytest>=8,<10'
          sha256sum -c LS2B_CADENCE_FREEZE.sha256
          python -m pytest -q tests/test_ls2b_cadence_discovery.py

      - name: Execute dedicated cadence-view discovery
        run: |
          python scripts/ls2b_cadence_discovery.py \
            config/ls2b_cadence_discovery.json
          test "$(jq -r .status results_ls2b_cadence/cadences.json)" \
            = "complete-metadata-only-cadence-discovery"
          test "$(jq -r .spectral_payload_inspected results_ls2b_cadence/cadences.json)" \
            = "false"
          test "$(jq -r .spectral_dataset_values_read results_ls2b_cadence/cadences.json)" \
            = "false"
          test "$(jq -r .spectral_urls_opened results_ls2b_cadence/cadences.json)" \
            = "false"
          test "$(jq -r .search_authorized results_ls2b_cadence/cadences.json)" \
            = "false"

      - name: Record reproducibility evidence
        run: |
          python -m pip freeze > results_ls2b_cadence/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_ls2b_cadence/run_metadata.json').write_text(
              json.dumps(
                  {
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'branch': os.environ['GITHUB_REF_NAME'],
                      'archive_json_only': True,
                      'spectral_dataset_values_read': False,
                      'raw_spectral_payload_published': False,
                      'technosignature_claimed': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          find results_ls2b_cadence -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_LS2B_CADENCE.sha256
          sha256sum -c RESULTS_MANIFEST_LS2B_CADENCE.sha256

      - name: Upload metadata evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: ls2b-cadence-discovery
          if-no-files-found: error
          retention-days: 90
          path: |
            LS2B_CADENCE_RESULT.md
            RESULTS_MANIFEST_LS2B_CADENCE.sha256
            results_ls2b_cadence/

      - name: Publish checked metadata result atomically
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('LS2B_CADENCE_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_name': 'ls2b-cadence-discovery',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'spectral_dataset_values_read': False,
                      'raw_spectral_payload_published': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          sha256sum -c RESULTS_MANIFEST_LS2B_CADENCE.sha256
          git fetch origin ls2b-cadence-discovery
          test "$(git rev-parse origin/ls2b-cadence-discovery)" = "$GITHUB_SHA"
          git add LS2B_CADENCE_RESULT.md LS2B_CADENCE_PROVENANCE.json \
            RESULTS_MANIFEST_LS2B_CADENCE.sha256 results_ls2b_cadence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish LS2B cadence discovery"
          git push origin HEAD:ls2b-cadence-discovery
