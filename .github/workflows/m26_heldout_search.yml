name: Milestone 26 held-out HD 19994 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26_heldout_search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_26_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "b8b63302c1ed0390cda1b4d2df83af946e031da4b3cc44ff3650803542ed32f0"
          test "$(sha256sum config/hd19994b_heldout_m26.json | cut -d' ' -f1)" \
            = "4ae3587e7c75835e72298a22dffcb5887d711b0b7720977b6c1384e9277a6047"
          test "$(sha256sum results_m26_selected_metadata/hd19994b.json | cut -d' ' -f1)" \
            = "0d522301a5774ad8232d0bb3f12ffc7052bf00a7868d9ef7303c2ba5209229fe"
          test "$(sha256sum results_m26_preflight/coverage.json | cut -d' ' -f1)" \
            = "e8630f1275df3a3e1116a4a734c0666a387cdb9b3477cc0ad0e0cc5cb318dea9"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m26.json
          python scripts/m14_coverage_preflight.py \
            config/hd19994b_heldout_m26.json \
            --output results_m26/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m26
          python -m pip freeze > results_m26/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m26/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': 'c4f0f977de0a39f2dcafa4b49ee201884707e6d4',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': '4ae3587e7c75835e72298a22dffcb5887d711b0b7720977b6c1384e9277a6047',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd19994b_heldout_m26.json \
            --data-dir data_m26

      - name: Hash extracted slices
        run: |
          find data_m26 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M26.sha256
          test "$(wc -l < DATA_MANIFEST_M26.sha256)" -eq 30

      - name: Run frozen detector v0.5.0 with complete cluster retention
        run: |
          seti-repeater search \
            --config config/hd19994b_heldout_m26.json \
            --data-dir data_m26 \
            --output-dir results_m26

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m26/search_summary.json').read_text())
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1008
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m26 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M26.sha256

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-26-held-out-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation_m26.json
            DATA_MANIFEST_M26.sha256
            RESULTS_MANIFEST_M26.sha256
            results_m26/
