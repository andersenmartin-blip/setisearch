name: Milestone 31 higher-smearing HDF5 header screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m31_header_screen.yml"

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install header-adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027'

      - name: Verify frozen inputs
        run: |
          test "$(sha256sum results_m16_discovery/discovery.json | cut -d' ' -f1)" \
            = "0310d5ba8e0923062bd0a046b1827a4e814fc3f3adf854620d27e3cccb7fd750"
          test "$(sha256sum scripts/m31_header_screen.py | cut -d' ' -f1)" \
            = "c85ba2be3c8f5b3e2eb30559a771bd0279e65f3fb788bb6be72e2dea64123a48"
          test "$(sha256sum MILESTONE_31_HEADER_SCREEN_PLAN.md | cut -d' ' -f1)" \
            = "56921954e39625e6b4520ab76636e2a611e0a8d1367fc493502b9d8a30630e23"

      - name: Run fixed HDF5-header-only screen
        run: |
          python scripts/m31_header_screen.py \
            --discovery results_m16_discovery/discovery.json \
            --output results_m31_header_screen/header_screen.json

      - name: Verify spectral boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m31_header_screen/header_screen.json').read_text()
          )
          assert result['spectral_payload_inspected'] is False
          assert result['spectral_dataset_values_read'] is False
          assert result['frozen_extension_ranks'] == [31, 32, 33, 34, 35]
          assert result['higher_smearing_width_bank_frozen'] == [
              1, 3, 5, 9, 17, 33
          ]
          assert len(result['screened_targets']) == 5
          assert [item['rank'] for item in result['screened_targets']] == \
              [31, 32, 33, 34, 35]
          assert all(
              item['low_smearing_bucket'] is False
              for item in result['screened_targets']
          )
          PY
          find results_m31_header_screen -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256
          test "$(wc -l < RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256

      - name: Upload header-screen evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-31-header-screen
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256
            results_m31_header_screen/

      - name: Record provenance and publish checked screen
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_31_HEADER_SCREEN_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-31-header-screen',
                      'spectral_payload_inspected': False,
                      'spectral_dataset_values_read': False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m31_header_screen/header_screen.json \
            MILESTONE_31_HEADER_SCREEN_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M31_HEADER_SCREEN.sha256 \
            results_m31_header_screen \
            MILESTONE_31_HEADER_SCREEN_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 31 header screen"
          git push origin HEAD:main
