name: Milestone 21 held-out HD 154345 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m21_heldout_search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_21_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "043f611298d095762d6c13f3f99cda9e1bfee1ff711d466cc5ac743cc3cdcbc0"
          test "$(sha256sum config/hd154345b_heldout_m21.json | cut -d' ' -f1)" \
            = "441597c69c1b3227648ee7aaf4bd6c8b0a09241c807755e03b355baa194b21e7"
          test "$(sha256sum results_m21_selected_metadata/hd154345b.json | cut -d' ' -f1)" \
            = "76bc95d49d669409ea35934f11f7db2d0accb265d14595361ce9553cc62a5c10"
          test "$(sha256sum results_m21_preflight/coverage.json | cut -d' ' -f1)" \
            = "aa76b849b7807169656213b7c34640e52f3201c7c87a8321a08ba686f3047dfe"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m21.json
          python scripts/m14_coverage_preflight.py \
            config/hd154345b_heldout_m21.json \
            --output results_m21/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m21
          python -m pip freeze > results_m21/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m21/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': '441597c69c1b3227648ee7aaf4bd6c8b0a09241c807755e03b355baa194b21e7',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd154345b_heldout_m21.json \
            --data-dir data_m21

      - name: Hash extracted slices
        run: |
          find data_m21 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M21.sha256
          test "$(wc -l < DATA_MANIFEST_M21.sha256)" -eq 30

      - name: Run frozen detector v0.5.0
        run: |
          seti-repeater search \
            --config config/hd154345b_heldout_m21.json \
            --data-dir data_m21 \
            --output-dir results_m21

      - name: Hash primary results
        run: |
          find results_m21 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M21.sha256

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-21-held-out-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation_m21.json
            DATA_MANIFEST_M21.sha256
            RESULTS_MANIFEST_M21.sha256
            results_m21/
