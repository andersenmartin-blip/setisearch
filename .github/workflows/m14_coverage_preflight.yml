name: Milestone 14 full-bank coverage preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m14_coverage_preflight.yml"
      - "config/gj687b_heldout_m14.json"
      - "scripts/m14_coverage_preflight.py"
      - "scripts/m13_hdf5_extract.py"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector geometry dependencies
        run: python -m pip install -e .

      - name: Prove extraction coverage for the complete frozen bank
        run: |
          python scripts/m14_coverage_preflight.py \
            config/gj687b_heldout_m14.json \
            --output results_m14/coverage_preflight.json

      - name: Assert metadata-only preflight result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("results_m14/coverage_preflight.json").read_text()
          )
          assert result["spectral_payload_inspected"] is False
          assert result["remote_files_opened"] is False
          assert result["checks"] == 630
          assert result["passed"] is True
          PY

      - name: Upload coverage proof
        uses: actions/upload-artifact@v4
        with:
          name: milestone-14-full-bank-coverage-preflight
          retention-days: 90
          path: results_m14/coverage_preflight.json
