name: Milestone 31 HD 192263 b higher-smearing coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m31_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_31_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "66214a02c0e452820c95dbb379c7392a38fb9bfbf8c0e4e7966e5cb9abd90141"
          test "$(sha256sum results_m31_selected_metadata/hd192263b.json | cut -d' ' -f1)" \
            = "d453e45be5a66894978d4f3d17d150a512eb249db8e2f0247e26b7fd2f03dc84"
          test "$(sha256sum config/hd192263b_m31_preflight.json | cut -d' ' -f1)" \
            = "60d5214245122ae83f9ad54f20fa12da95c92d05d62322eb261a7d006858a5be"
          test "$(sha256sum scripts/m31_coverage_preflight.py | cut -d' ' -f1)" \
            = "ab3a38c27c86ae5aad21c4aea615a43cc7e8ba498c424a124bde92c4b9786615"

      - name: Run metadata-only motion and width-bank coverage proof
        run: |
          python scripts/m31_coverage_preflight.py \
            config/hd192263b_m31_preflight.json \
            --output results_m31_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m31_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_width_bank_channels'] == [1, 3, 5, 9, 17, 33]
          assert result['spectral_half_width_channels'] == 16
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m31_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256
          test "$(wc -l < RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-31-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256
            results_m31_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_31_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-31-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                      'spectral_width_bank_channels': [1, 3, 5, 9, 17, 33],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m31_preflight/coverage.json \
            MILESTONE_31_COVERAGE_PREFLIGHT_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M31_COVERAGE_PREFLIGHT.sha256 \
            results_m31_preflight \
            MILESTONE_31_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 31 coverage preflight"
          git push origin HEAD:main
