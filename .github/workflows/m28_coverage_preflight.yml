name: Milestone 28 psi1 Dra B b coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m28_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_28_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "ae7ab46361c7a2df3d99475c4f8ab5be3fdb6119d23bd8c62ffc0ace6b7179ef"
          test "$(sha256sum results_m28_selected_metadata/psi1drabb.json | cut -d' ' -f1)" \
            = "dc735eb5bd12b249240781ad757d284e1e637fca4f7b671652b0666348976110"
          test "$(sha256sum config/psi1drabb_m28_preflight.json | cut -d' ' -f1)" \
            = "251142dadf4387ce1e6bb2b9942beb10a1a9dfd63e6f6d5e240e2b9c0dd13d4f"
          test "$(sha256sum scripts/m14_coverage_preflight.py | cut -d' ' -f1)" \
            = "95eb2dfc6c0b52db391ab09b844e553b5244de48203827134acdde640474115c"

      - name: Run metadata-only full-bank coverage proof
        run: |
          python scripts/m14_coverage_preflight.py \
            config/psi1drabb_m28_preflight.json \
            --output results_m28_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m28_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m28_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M28_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-28-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M28_COVERAGE_PREFLIGHT.sha256
            results_m28_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_28_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'github_sha': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-28-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          git add RESULTS_MANIFEST_M28_COVERAGE_PREFLIGHT.sha256 \
            results_m28_preflight \
            MILESTONE_28_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 28 coverage preflight"
          git push origin HEAD:main
