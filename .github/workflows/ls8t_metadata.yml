name: LS8T TESS_260647166 paired-image metadata preflight
on:
  push:
    branches: [m43-support-qualification]
    paths: ['.github/workflows/ls8t_metadata.yml']
permissions:
  contents: write
concurrency:
  group: ls8t-metadata
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 astropy==7.0.2
      - name: Read metadata, join every context, independently audit
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/ls8t_metadata.py 2>&1 | tee /tmp/ls8t_metadata.log
          python -u scripts/ls8t_join_metadata.py 2>&1 | tee /tmp/ls8t_joins.log
          python -u scripts/ls8t_images_audit.py --metadata-only 2>&1 | tee /tmp/ls8t_meta_audit.log
      - name: Preserve metadata outcome and exact future ranges
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.metadata.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_ls8t_metadata
          for f in /tmp/ls8t_metadata.log /tmp/ls8t_joins.log /tmp/ls8t_meta_audit.log; do
            if test -f "$f"; then cp "$f" results_ls8t_metadata/; fi
          done
          python -m pip freeze | sort > results_ls8t_metadata/environment.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('results_ls8t_metadata'); audit=out/'audit.json'
          status=json.loads(audit.read_text())['status'] if audit.exists() else 'INCOMPLETE'
          (out/'RUN_STATUS.json').write_text(json.dumps({'execution_outcome':os.environ['RUN_OUTCOME'],'scientific_status':status,'freeze_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          git add results_ls8t_metadata
          if test -f config/ls8t_images.json; then git add config/ls8t_images.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish LS8T image metadata joins and exact future payload ranges'
          git push origin HEAD:m43-support-qualification
      - name: Require successful metadata and join gate
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.metadata.outcome }}
        run: test "$RUN_OUTCOME" = success
