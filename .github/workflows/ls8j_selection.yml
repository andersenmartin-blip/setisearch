name: LS8J archive-wide metadata cohort selection

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8j_selection.yml'

permissions:
  contents: write

concurrency:
  group: ls8j-selection
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install dace-query==3.0.1
      - name: Run bounded metadata-only cohort selection
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/ls8j_select_cohort.py | tee /tmp/ls8j.log
          cp /tmp/ls8j.log results_ls8j_selection/RUN.log
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('results_ls8j_selection/selection.json').read_text())
          assert s['census_rows']>0 and s['census_rows']<=1000
          assert s['science_product_bytes_read']==0
          assert s['fits_table_rows_read']==0
          assert s['lightcurve_values_read']==0
          assert s['image_pixels_read']==0
          assert s['product_download_calls']==0
          PY
          python -m pip freeze | sort > results_ls8j_selection/environment.txt
      - name: Publish LS8J metadata result
        shell: bash
        run: |
          set -euo pipefail
          git add results_ls8j_selection
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish LS8J archive-wide metadata cohort selection'
          git push origin HEAD:m43-support-qualification
