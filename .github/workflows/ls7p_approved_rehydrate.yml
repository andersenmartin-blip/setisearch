name: LS7P approved exact-object rehydration

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7p_approved_rehydrate.yml'

permissions:
  contents: write

concurrency:
  group: ls7p-approved-rehydrate
  cancel-in-progress: false

jobs:
  rehydrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
      FROZEN: f42aa216b25779d55cd1fabd25545d3277abcfa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Recreate from the frozen LS7P source
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls7p-frozen "$FROZEN"
          cd /tmp/ls7p-frozen
          python -m pip install -r requirements_ls7g.txt
          rm -rf results_ls7p_inputs results_ls7p_response
          python -u scripts/ls7p_acquire.py

      - name: Require exact approved Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls7p-frozen
          cat > /tmp/ls7p_expected_blobs.txt <<'EOF'
