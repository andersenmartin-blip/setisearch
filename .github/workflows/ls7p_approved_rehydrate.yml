          db6aa7f7206df8656f0489de1c8bcd10f2c31cd0 results_ls7p_inputs/sources.json
          EOF
          while read -r expected path; do
            test -f "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "blob mismatch: $path $actual != $expected"; exit 1; }
          done < /tmp/ls7p_expected_blobs.txt

      - name: Publish exact regenerated LS7P inputs to the approved branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_ls7p_inputs
          cp -a /tmp/ls7p-frozen/results_ls7p_inputs .
          git add results_ls7p_inputs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact regenerated LS7P input objects'
          git push origin HEAD:m43-support-qualification
