name: Milestone 32 higher-smearing held-out HD 99492 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m32_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_32_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "ebbe35fc48bcdbe179652edc9365312e4244a5927601143d21676a6ad6cbca42"
          test "$(sha256sum config/hd99492b_heldout_m32.json | cut -d' ' -f1)" \
            = "7f0f20f6e76f4182c9c9b94bb7ccca34c2d5345a459085362e480ef546732cf7"
          test "$(sha256sum results_m32_selected_metadata/hd99492b.json | cut -d' ' -f1)" \
            = "d17ebed8f9c0a5676a2140b36ba35424489acdd98fa9e936d80f23aa53c7f95b"
          test "$(sha256sum results_m32_preflight/coverage.json | cut -d' ' -f1)" \
            = "623874e1fdeac79308956186cfb056397b3f4c238743ffba9b55049c971dfe13"
          git merge-base --is-ancestor \
            1007a4de4e40834b8665489922f2add3f45940d0 "$GITHUB_SHA"

      - name: Validate detector and repeat width-aware coverage proof
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m32.json
          python scripts/m32_coverage_preflight.py \
            config/hd99492b_heldout_m32.json \
            --output results_m32/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m32
          python -m pip freeze > results_m32/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m32/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit':
                          '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit':
                          '1007a4de4e40834b8665489922f2add3f45940d0',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256':
                          '7f0f20f6e76f4182c9c9b94bb7ccca34c2d5345a459085362e480ef546732cf7',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd99492b_heldout_m32.json \
            --data-dir data_m32

      - name: Hash extracted slices
        run: |
          find data_m32 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M32.sha256
          test "$(wc -l < DATA_MANIFEST_M32.sha256)" -eq 30

      - name: Run frozen detector with complete wider-bank cluster retention
        run: |
          seti-repeater search \
            --config config/hd99492b_heldout_m32.json \
            --data-dir data_m32 \
            --output-dir results_m32

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m32/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          assert result['search_dimensions']['spectral_width_templates'] == [
              1, 3, 5, 9, 17, 33
          ]
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1512
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m32 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M32.sha256
          test "$(wc -l < RESULTS_MANIFEST_M32.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M32.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-32-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m32.json
            DATA_MANIFEST_M32.sha256
            RESULTS_MANIFEST_M32.sha256
            results_m32/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_32_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit':
                          '1007a4de4e40834b8665489922f2add3f45940d0',
                      'frozen_config_sha256':
                          '7f0f20f6e76f4182c9c9b94bb7ccca34c2d5345a459085362e480ef546732cf7',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-32-held-out-results',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M32.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M32.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M32.sha256
          jq empty validation_m32.json \
            results_m32/search_summary.json \
            results_m32/completeness.json \
            results_m32/coverage_preflight_repeat.json \
            results_m32/run_metadata.json \
            MILESTONE_32_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m32.json \
            DATA_MANIFEST_M32.sha256 \
            RESULTS_MANIFEST_M32.sha256 \
            results_m32 \
            MILESTONE_32_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 32 result"
          git push origin HEAD:main
