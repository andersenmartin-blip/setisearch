name: Milestone 13 metadata probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/m13_catalog_probe.py"
      - ".github/workflows/m13_catalog_probe.yml"
      - "tests/M13_METADATA_TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e . h5py fsspec
      - name: Probe catalogue and SIGPROC headers only
        run: python scripts/m13_catalog_probe.py --output results_m13/catalog_probe.json
      - name: Upload metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: m13-catalog-probe
          path: results_m13/catalog_probe.json
          if-no-files-found: error
          retention-days: 7
