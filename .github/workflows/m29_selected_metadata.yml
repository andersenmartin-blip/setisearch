name: Milestone 29 HD 11964 selected-target metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m29_selected_metadata.yml"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen selection inputs and metadata query
        run: |
          test "$(sha256sum results_m16_discovery/discovery.json | cut -d' ' -f1)" \
            = "0310d5ba8e0923062bd0a046b1827a4e814fc3f3adf854620d27e3cccb7fd750"
          test "$(sha256sum results_m29_header_screen/header_screen.json | cut -d' ' -f1)" \
            = "81d6df50f94f6970494b57e414a091d234600f9ee04daf76772919412bbed592"
          test "$(sha256sum MILESTONE_29_TARGET_SELECTION.md | cut -d' ' -f1)" \
            = "50b0f6a63e606b50dd67bbafbbb7b88f6e275f5cdb46dcca7bf569cf48f2625e"
          test "$(sha256sum scripts/m29_selected_metadata.py | cut -d' ' -f1)" \
            = "fadd175441cf04b3fbcb4bfed6fa58fa6db7915300140cf20d22b7f123a7c46a"

      - name: Verify mechanical HD 11964 selection and spectral boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          screen = json.loads(
              Path('results_m29_header_screen/header_screen.json').read_text()
          )
          targets = {item['rank']: item for item in screen['screened_targets']}
          assert screen['selected']['rank'] == 28
          assert screen['selected']['archive_target'] == 'HIP9094'
          assert screen['selected']['planet_name'] == 'HD 11964 b'
          assert targets[26]['qualifying_count'] == 0
          assert targets[27]['qualifying_count'] == 0
          assert targets[28]['qualifying_count'] == 1
          assert targets[29]['qualifying_count'] == 1
          assert targets[30]['qualifying_count'] == 0
          primary = screen['selected']['cadence']
          assert primary['cadence_url'].endswith('/--66653')
          assert len(primary['headers']) == 6
          assert primary['scan_sources'] == [
              'HIP9094', 'HIP10172', 'HIP9094',
              'HIP8092', 'HIP9094', 'HIP8144'
          ]
          assert all(
              header['spectral_dataset_values_read'] is False
              for header in primary['headers']
          )
          PY

      - name: Fetch selected official record
        run: python scripts/m29_selected_metadata.py

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m29_selected_metadata/hd11964b.json').read_text()
          )
          assert result['spectral_payload_inspected'] is False
          assert result['record']['pl_name'] == 'HD 11964 b'
          assert result['record']['hostname'] == 'HD 11964'
          assert result['record']['hip_name'] == 'HIP 9094'
          assert result['record']['hd_name'] == 'HD 11964'
          PY
          find results_m29_selected_metadata -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256
          test "$(wc -l < RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256

      - name: Upload selected metadata
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-29-selected-metadata
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256
            results_m29_selected_metadata/

      - name: Record provenance and publish checked metadata
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_29_SELECTED_METADATA_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-29-selected-metadata',
                      'spectral_payload_inspected': False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m29_selected_metadata/hd11964b.json \
            MILESTONE_29_SELECTED_METADATA_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M29_SELECTED_METADATA.sha256 \
            results_m29_selected_metadata \
            MILESTONE_29_SELECTED_METADATA_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 29 selected metadata"
          git push origin HEAD:main
