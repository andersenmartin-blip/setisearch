name: LS7P exact release inventory

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7p_release_inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate and verify exact release inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('.')
          exact={
            'LS7P_CONTINUATION.md','LS7P_PUBLICATION_RECONCILIATION.md',
            'LS7V_CONTINUATION.md','PROJECT_STATUS.md','TWO_WEEK_PLAN_2026-09-14.md',
            'scripts/ls7p_verify_reconstruction.py'
          }
          paths=set(exact)
          for d in ['results_ls7p_inputs','results_ls7p_reconstruction','results_ls7p_response']:
              paths.update(str(p) for p in (root/d).rglob('*') if p.is_file())
          paths=sorted(paths)
          rows=[]
          for rel in paths:
              p=root/rel
              rows.append({
                  'path':rel,
                  'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'git_blob_sha':subprocess.check_output(['git','hash-object',rel],text=True).strip()
              })
          obj={
              'base_science_commit':'defaaf3128bd6d65f79d8d31ac2a14949ace5040',
              'source_freeze':'f42aa216b25779d55cd1fabd25545d3277abcfa5',
              'scope':'LS7P explicit reconstruction evidence and operational continuation',
              'inventory_excludes_itself':True,
              'file_count':len(rows),
              'total_payload_bytes':sum(r['bytes'] for r in rows),
              'files':rows
          }
          Path('release_inventory.json').write_text(json.dumps(obj,indent=2)+'\n')
          assert len(rows)==82, len(rows)
          PY
          actual="$(git hash-object release_inventory.json)"
          test "$actual" = "a5509358cb153533fa5a3d32928d149536a647c7" || { echo "release inventory mismatch: $actual"; exit 1; }
      - name: Publish exact release inventory
        shell: bash
        run: |
          set -euo pipefail
          git add release_inventory.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact LS7P release inventory'
          git push origin HEAD:m43-support-qualification
