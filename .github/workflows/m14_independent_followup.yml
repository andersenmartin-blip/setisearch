name: Milestone 14 partial independent-cadence follow-up

on:
  pull_request:
    paths:
      - ".github/workflows/m14_independent_followup.yml"
      - "m14-independent-followup-trigger.md"

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered files
        run: |
          test "$(sha256sum config/gj687b_m14_partial_independent_followup.json | cut -d' ' -f1)" \
            = "2c652ce41f66b3c0cc0c1963061a92c01a04d297f35b9319da6acb9ee848a228"
          test "$(sha256sum scripts/m14_independent_cadence_followup.py | cut -d' ' -f1)" \
            = "5cbc1e2fcc9ddb3482c6832e0638631e8fd211f82f9e6fec5c9ee48ee84f79d9"

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Run fixed partial independent-cadence follow-up
        run: |
          python scripts/m14_independent_cadence_followup.py --extract

      - name: Hash extracted slices and results
        run: |
          find data_m14_independent_followup -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M14_INDEPENDENT_FOLLOWUP.sha256
          find results_m14_independent_followup -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M14_INDEPENDENT_FOLLOWUP.sha256

      - name: Upload follow-up evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-14-independent-followup
          if-no-files-found: warn
          retention-days: 90
          path: |
            DATA_MANIFEST_M14_INDEPENDENT_FOLLOWUP.sha256
            RESULTS_MANIFEST_M14_INDEPENDENT_FOLLOWUP.sha256
            results_m14_independent_followup/
