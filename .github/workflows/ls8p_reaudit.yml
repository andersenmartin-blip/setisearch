name: LS8P serialization-only independent audit recovery
on:
  push:
    branches: [m43-support-qualification]
    paths: ['.github/workflows/ls8p_reaudit.yml']
permissions:
  contents: write
concurrency:
  group: ls8p-reaudit
  cancel-in-progress: false
jobs:
  reaudit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements_ls7g.txt
      - name: Regression, original independent audit and report
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ls8p_serialization -v 2>&1 | tee /tmp/ls8p_recovery_test.log
          python -u scripts/ls8p_reaudit.py 2>&1 | tee /tmp/ls8p_reaudit.log
      - name: Preserve complete or failed recovery
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.recovery.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_ls8p_verified
          for f in /tmp/ls8p_recovery_test.log /tmp/ls8p_reaudit.log; do
            if test -f "$f"; then cp "$f" results_ls8p_verified/; fi
          done
          python -m pip freeze | sort > results_ls8p_verified/environment.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('results_ls8p_verified'); result=out/'summary.json'
          status=json.loads(result.read_text())['status'] if result.exists() else 'INCOMPLETE'
          (out/'RUN_STATUS.json').write_text(json.dumps({'execution_outcome':os.environ['RUN_OUTCOME'],'scientific_status':status,'recovery_freeze_commit':os.environ['GITHUB_SHA'],'original_freeze_commit':'cbee527850ef9d6bc392506cd958961321e0ec5f'},indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          git add results_ls8p_verified
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve LS8P independent audit recovery with unchanged arithmetic and original failed run'
          git push origin HEAD:m43-support-qualification
      - name: Require successful audit recovery
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.recovery.outcome }}
        run: test "$RUN_OUTCOME" = success
