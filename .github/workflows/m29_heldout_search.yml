name: Milestone 29 held-out HD 11964 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m29_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_29_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "ab35eefd1e1c8a4e67a57bf45b07a2e608dde6d6eb8ed897e3ba60ec15542452"
          test "$(sha256sum config/hd11964b_heldout_m29.json | cut -d' ' -f1)" \
            = "d5e6da15f512957e1395fd201636fdc944d35e1c2fc99c70bed33ad10dc7a203"
          test "$(sha256sum results_m29_selected_metadata/hd11964b.json | cut -d' ' -f1)" \
            = "7e115168f1e6e02cef24b64a88b17c3b96b346d1c365d7b9bc0bd5a0990897e3"
          test "$(sha256sum results_m29_preflight/coverage.json | cut -d' ' -f1)" \
            = "0dc5353dbad82a0ff2b52598b1cefcca75530f0f0be68c1f27c0d14513bb35c4"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 18.253611008 \
            --channel-width 2.7939677238464355 \
            --output validation_m29.json
          python scripts/m14_coverage_preflight.py \
            config/hd11964b_heldout_m29.json \
            --output results_m29/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m29
          python -m pip freeze > results_m29/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m29/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit':
                          '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit':
                          'ee8ba852a33d6c96b560649a0eca9e8038a6e5c7',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256':
                          'd5e6da15f512957e1395fd201636fdc944d35e1c2fc99c70bed33ad10dc7a203',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd11964b_heldout_m29.json \
            --data-dir data_m29

      - name: Hash extracted slices
        run: |
          find data_m29 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M29.sha256
          test "$(wc -l < DATA_MANIFEST_M29.sha256)" -eq 30

      - name: Run frozen detector v0.5.0 with complete cluster retention
        run: |
          seti-repeater search \
            --config config/hd11964b_heldout_m29.json \
            --data-dir data_m29 \
            --output-dir results_m29

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m29/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1008
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m29 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M29.sha256
          test "$(wc -l < RESULTS_MANIFEST_M29.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M29.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-29-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m29.json
            DATA_MANIFEST_M29.sha256
            RESULTS_MANIFEST_M29.sha256
            results_m29/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_29_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit':
                          'ee8ba852a33d6c96b560649a0eca9e8038a6e5c7',
                      'frozen_config_sha256':
                          'd5e6da15f512957e1395fd201636fdc944d35e1c2fc99c70bed33ad10dc7a203',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-29-held-out-results',
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M29.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M29.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M29.sha256
          jq empty validation_m29.json \
            results_m29/search_summary.json \
            results_m29/completeness.json \
            results_m29/coverage_preflight_repeat.json \
            results_m29/run_metadata.json \
            MILESTONE_29_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m29.json \
            DATA_MANIFEST_M29.sha256 \
            RESULTS_MANIFEST_M29.sha256 \
            results_m29 \
            MILESTONE_29_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 29 result"
          git push origin HEAD:main
