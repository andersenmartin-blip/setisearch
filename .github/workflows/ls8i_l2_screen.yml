name: LS8I frozen GJ 649 two-visit L2 screen

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8i_l2_screen.yml'

permissions:
  contents: write

concurrency:
  group: ls8i-gj649-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 astropy==7.0.2
      - name: Run frozen GJ 649 screen and independent audit
        shell: bash
        run: |
          set -euo pipefail
          freeze="$(git rev-parse HEAD)"
          python -u scripts/ls8i_l2_screen.py --freeze "$freeze" | tee /tmp/ls8i_run.log
          python -u scripts/ls8i_l2_audit.py | tee /tmp/ls8i_audit.log
          cp /tmp/ls8i_run.log results_ls8i_l2_screen/RUN.log
          cp /tmp/ls8i_audit.log results_ls8i_l2_screen/AUDIT.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results_ls8i_l2_screen')
          s=json.loads((p/'summary.json').read_text())
          a=json.loads((p/'audit.json').read_text())
          assert s['status']=='COMPLETE_AUDITED'
          assert a['status']=='PASS'
          assert s['target']=='GJ 649'
          assert s['selected_keys']==['CH_PR100018_TG018601_V0300','CH_PR100018_TG031201_V0300']
          assert s['totals']['science_table_bytes']==27876
          assert s['image_bytes_acquired']==0
          assert s['raw_imagettes_opened'] is False
          PY
      - name: Publish audited LS8I result
        shell: bash
        run: |
          set -euo pipefail
          git add results_ls8i_l2_screen
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish audited LS8I GJ 649 two-visit L2 screen'
          git push origin HEAD:m43-support-qualification
