name: Milestone 25 HD 164922 b coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m25_coverage_preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_25_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "49597d63888cb302bf1829e7503e06f34e9e98803623c23351d9a7c9ec44fb9f"
          test "$(sha256sum results_m25_selected_metadata/hd164922b.json | cut -d' ' -f1)" \
            = "d826ef7192f68194440e31cec7fe1bd701d60187e60fff48605f50b7d88dde52"
          test "$(sha256sum config/hd164922b_m25_preflight.json | cut -d' ' -f1)" \
            = "4b59dc38a981f8fbe9e07db7a9d3b3c8c5440bbf65a364a5835c271d2f94f840"
          test "$(sha256sum scripts/m14_coverage_preflight.py | cut -d' ' -f1)" \
            = "95eb2dfc6c0b52db391ab09b844e553b5244de48203827134acdde640474115c"

      - name: Run metadata-only full-bank coverage proof
        run: |
          python scripts/m14_coverage_preflight.py \
            config/hd164922b_m25_preflight.json \
            --output results_m25_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m25_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m25_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M25_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-25-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M25_COVERAGE_PREFLIGHT.sha256
            results_m25_preflight/
