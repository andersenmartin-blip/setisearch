name: Milestone 16 corrected HDF5 header-only cadence screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m16_header_screen.yml"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install header-adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027'

      - name: Verify frozen inputs
        run: |
          test "$(sha256sum results_m16_discovery/discovery.json | cut -d' ' -f1)" \
            = "0310d5ba8e0923062bd0a046b1827a4e814fc3f3adf854620d27e3cccb7fd750"
          test "$(sha256sum scripts/m16_header_screen.py | cut -d' ' -f1)" \
            = "c784146aa01919f957d05b42671daea90e8c77da401236430b5cf93e516e4f2a"

      - name: Run fixed HDF5-header-only screen
        run: |
          python scripts/m16_header_screen.py \
            --discovery results_m16_discovery/discovery.json \
            --output results_m16_header_screen_corrected/header_screen.json

      - name: Verify spectral boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m16_header_screen_corrected/header_screen.json').read_text())
          assert result['spectral_payload_inspected'] is False
          assert result['spectral_dataset_values_read'] is False
          PY
          find results_m16_header_screen_corrected -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M16_HEADER_SCREEN_CORRECTED.sha256

      - name: Upload header-screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-16-header-screen-corrected
          if-no-files-found: warn
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M16_HEADER_SCREEN_CORRECTED.sha256
            results_m16_header_screen_corrected/
