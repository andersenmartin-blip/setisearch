name: LS7P exact NPZ rehydration

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7p_npz_rehydrate.yml'

permissions:
  contents: write

jobs:
  rehydrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
      FROZEN: f42aa216b25779d55cd1fabd25545d3277abcfa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Recreate only pre-assertion LS7P NPZ outputs
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls7p-frozen "$FROZEN"
          cp -a results_ls7p_inputs /tmp/ls7p-frozen/
          cd /tmp/ls7p-frozen
          python -m pip install -r requirements_ls7g.txt
          rm -rf results_ls7p_response
          set +e
          python -u scripts/ls7p_evaluate.py
          rc=$?
          set -e
          test "$rc" -ne 0
          test -d results_ls7p_response
      - name: Require exact approved NPZ Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls7p-frozen
          cat > /tmp/ls7p_npz_expected.txt <<'EOF'
          da71ff54ccb5895cb6bff23f4555de3728a55825 results_ls7p_response/s029_tic306577335.npz
          ee67f11975039bf2bd6dae0714b1460e9a3592b7 results_ls7p_response/s029_tic306739391.npz
          a56389f823b83f970e5fa962d97c3ea617fcc699 results_ls7p_response/s029_tic306739511.npz
          962a523491af8bb8c9b5c4fedd96efe9ea6e1201 results_ls7p_response/s029_tic307087642.npz
          80f3ef5e5f78ddd80bb2e24effe8dfdc573431f4 results_ls7p_response/s029_tic307780535.npz
          bab6f5c1f10cc2012620c4ae1c4ee9a0fd673594 results_ls7p_response/s029_tic307785290.npz
          90299b446063e9a95f259358c5d0bb9c16848966 results_ls7p_response/s032_tic306577335.npz
          d363648fe5e84bd1c56af9b1d4ee2abf1f8fd49d results_ls7p_response/s032_tic306739391.npz
          ddd0ecea624420bb19695fe16c6cd690bbc2cc56 results_ls7p_response/s032_tic306739511.npz
          544c6eeea6953bb5e34831b55a77483a08d1fc40 results_ls7p_response/s032_tic307441274.npz
          cd0d9e983040af3b1a7616df65899772d8ae376e results_ls7p_response/s032_tic307780535.npz
          d7208f39f48cdc4e9577aee98a4f9f15343c4c31 results_ls7p_response/s032_tic307785290.npz
          EOF
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected" || { echo "blob mismatch: $path"; exit 1; }
          done < /tmp/ls7p_npz_expected.txt
      - name: Publish exact NPZ outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_ls7p_response
          cp /tmp/ls7p-frozen/results_ls7p_response/*.npz results_ls7p_response/
          git add results_ls7p_response/*.npz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact regenerated LS7P NPZ result objects'
          git push origin HEAD:m43-support-qualification
