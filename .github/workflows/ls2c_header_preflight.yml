name: LS2C HD 260655 header preflight

on:
  workflow_dispatch:
  push:
    branches: [ls2c-hd260655-header-preflight]
    paths:
      - ".github/workflows/ls2c_header_preflight.yml"
      - "LS2C_HD260655_HEADER_PLAN.md"
      - "LS2C_HEADER_FREEZE.sha256"
      - "config/ls2c_hd260655_header_preflight.json"
      - "scripts/ls2c_header_preflight.py"
      - "tests/test_ls2c_header_preflight.py"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require unpublished LS2C result boundary
        run: |
          test ! -e results_ls2c_header/preflight.json
          test ! -e LS2C_HEADER_RESULT.md
          test ! -e RESULTS_MANIFEST_LS2C_HEADER.sha256
          test ! -e LS2C_HEADER_PROVENANCE.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify frozen header implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'pytest>=8,<10'
          sha256sum -c LS2C_HEADER_FREEZE.sha256
          python -m pytest -q tests/test_ls2c_header_preflight.py

      - name: Execute HDF5-header-only preflight
        run: |
          python scripts/ls2c_header_preflight.py \
            config/ls2c_hd260655_header_preflight.json
          test "$(jq -r .status results_ls2c_header/preflight.json)" \
            = "complete-header-only-preflight"
          test "$(jq -r .remote_hdf5_metadata_opened results_ls2c_header/preflight.json)" \
            = "true"
          test "$(jq -r .spectral_dataset_values_read results_ls2c_header/preflight.json)" \
            = "false"
          test "$(jq -r .search_authorized results_ls2c_header/preflight.json)" \
            = "false"

      - name: Record reproducibility evidence
        run: |
          python -m pip freeze > results_ls2c_header/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_ls2c_header/run_metadata.json').write_text(
              json.dumps(
                  {
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'branch': os.environ['GITHUB_REF_NAME'],
                      'hdf5_metadata_only': True,
                      'spectral_dataset_values_read': False,
                      'raw_spectral_payload_published': False,
                      'technosignature_claimed': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          find results_ls2c_header -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_LS2C_HEADER.sha256
          sha256sum -c RESULTS_MANIFEST_LS2C_HEADER.sha256

      - name: Upload header evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: ls2c-hd260655-header-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            LS2C_HEADER_RESULT.md
            RESULTS_MANIFEST_LS2C_HEADER.sha256
            results_ls2c_header/

      - name: Publish checked header result atomically
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('LS2C_HEADER_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_name': 'ls2c-hd260655-header-preflight',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'spectral_dataset_values_read': False,
                      'raw_spectral_payload_published': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          sha256sum -c RESULTS_MANIFEST_LS2C_HEADER.sha256
          git fetch origin ls2c-hd260655-header-preflight
          test "$(git rev-parse origin/ls2c-hd260655-header-preflight)" = "$GITHUB_SHA"
          git add LS2C_HEADER_RESULT.md LS2C_HEADER_PROVENANCE.json \
            RESULTS_MANIFEST_LS2C_HEADER.sha256 results_ls2c_header
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish LS2C HD 260655 header preflight"
          git push origin HEAD:ls2c-hd260655-header-preflight
