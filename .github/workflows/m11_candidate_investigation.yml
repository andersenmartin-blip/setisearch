name: Milestone 11 candidate investigation

on:
  push:
    paths:
      - .github/workflows/m11_candidate_investigation.yml
      - scripts/m11_candidate_investigation.py

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen detector package
        run: python -m pip install -e .
      - name: Run post-hoc candidate investigation
        run: >-
          python scripts/m11_candidate_investigation.py
          --extract
          --workers 12
      - name: Verify detector tests remain green
        run: python -m unittest discover -s tests -v
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-candidate-investigation
          path: results_m11_candidate_investigation/
          if-no-files-found: error
          retention-days: 7
