name: LS8J full metadata inventory reconciliation

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8j_reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: ls8j-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install dace-query==3.0.1
      - name: Reconcile exact frozen metadata population
        id: reconcile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/ls8j_reconcile_selection.py 2>&1 | tee /tmp/ls8j_reconcile.log
      - name: Preserve complete or obstructed metadata evidence
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.reconcile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_ls8j_reconciliation
          cp /tmp/ls8j_reconcile.log results_ls8j_reconciliation/RUN.log
          python -m pip freeze | sort > results_ls8j_reconciliation/environment.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('results_ls8j_reconciliation')
          result=out/'reconciliation.json'
          status=json.loads(result.read_text())['status'] if result.exists() else 'INCOMPLETE'
          (out/'RUN_STATUS.json').write_text(json.dumps({'execution_outcome':os.environ['RUN_OUTCOME'],'scientific_status':status,'freeze_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          git add results_ls8j_reconciliation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retain complete LS8J metadata inventory reconciliation and audit'
          git push origin HEAD:m43-support-qualification
