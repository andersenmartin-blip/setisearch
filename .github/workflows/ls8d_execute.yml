name: LS8D frozen paired CAL COR image study

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8d_execute.yml'

permissions:
  contents: write

concurrency:
  group: ls8d-frozen-paired-images
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FROZEN: 804c741dca3889a3e53f4f7165c78713238b25fb
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Check frozen source and run synthetic tests before image access
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls8d "$FROZEN"
          test "$(git -C /tmp/ls8d rev-parse HEAD)" = "$FROZEN"
          python -m pip install -r /tmp/ls8d/requirements_ls7g.txt
          cd /tmp/ls8d
          python -m unittest discover -s tests -p 'test_ls8d_images.py' -v 2>&1 | tee /tmp/ls8d_tests.log

      - name: Acquire exact frozen ranges and run paired analysis
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8d
          test ! -e results_ls8d_images/diagnostics.json
          python -u scripts/ls8d_images.py 2>&1 | tee /tmp/ls8d_run.log

      - name: Run independent frozen audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8d
          python -u scripts/ls8d_images_audit.py 2>&1 | tee /tmp/ls8d_audit.log

      - name: Verify bounded transfer and audited completion
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8d
          cp /tmp/ls8d_tests.log results_ls8d_images/TESTS.log
          cp /tmp/ls8d_run.log results_ls8d_images/RUN.log
          cp /tmp/ls8d_audit.log results_ls8d_images/AUDIT.log
          python -m pip freeze > results_ls8d_images/environment.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          out=Path('results_ls8d_images')
          cfg=json.loads(Path('config/ls8d_images.json').read_text())
          summary=json.loads((out/'summary.json').read_text())
          audit=json.loads((out/'audit.json').read_text())

          assert summary['status']=='COMPLETE_AUDITED', summary
          assert audit['status']=='PASS', audit
          assert summary['contexts']==8
          assert summary['image_bytes']==154240000
          assert summary['smearing_bytes']==385600
          assert summary['original_ls8b_audit']=='FAIL'
          assert summary['raw_imagettes_opened'] is False
          assert audit['original_ls8b_audit']=='FAIL'
          assert cfg['image_science_bytes']==154240000
          assert cfg['smearing_bytes']==385600
          assert cfg['join_rows']==482
          assert cfg['image_pixels_read']==0

          contexts=[c['id'] for c in cfg['contexts']]
          assert len(contexts)==8 and len(set(contexts))==8
          transfer=0
          receipts=0
          for cid in contexts:
              folder=out/cid
              for kind in ('SCI_CAL_SubArray','SCI_COR_SubArray','SMEAR'):
                  data=folder/(kind+'.bin.gz')
                  rec=folder/(kind+'.bin.gz.json')
                  assert data.is_file() and rec.is_file()
                  r=json.loads(rec.read_text())
                  assert r['status']==206
                  transfer += r['count']
                  receipts += 1
              assert (folder/'diagnostics.json').is_file()
              assert (folder/'event_maps.npz').is_file()
          assert receipts==24
          assert transfer==154625600, transfer

          rows=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS'):
              rel=p.relative_to(out)
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n')
          (out/'SHA256SUMS').write_text(''.join(rows))
          PY
          (cd results_ls8d_images && sha256sum -c SHA256SUMS)

      - name: Publish audited LS8D paired-image evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C /tmp/ls8d rev-parse HEAD)" = "$FROZEN"
          rm -rf results_ls8d_images
          cp -a /tmp/ls8d/results_ls8d_images .
          git add results_ls8d_images
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish audited LS8D paired CAL COR image study'
          git push origin HEAD:m43-support-qualification
