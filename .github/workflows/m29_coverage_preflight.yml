name: Milestone 29 HD 11964 b coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m29_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_29_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "ff0964e09416dc2cc6e0e018a83ca05b5a99c68d6158c594c11557d10b2f98ae"
          test "$(sha256sum results_m29_selected_metadata/hd11964b.json | cut -d' ' -f1)" \
            = "7e115168f1e6e02cef24b64a88b17c3b96b346d1c365d7b9bc0bd5a0990897e3"
          test "$(sha256sum config/hd11964b_m29_preflight.json | cut -d' ' -f1)" \
            = "aafb16332b458aec967e22756afc5189a1e32965f311660a5f40b830882d26f3"
          test "$(sha256sum scripts/m14_coverage_preflight.py | cut -d' ' -f1)" \
            = "95eb2dfc6c0b52db391ab09b844e553b5244de48203827134acdde640474115c"

      - name: Run metadata-only full-bank coverage proof
        run: |
          python scripts/m14_coverage_preflight.py \
            config/hd11964b_m29_preflight.json \
            --output results_m29_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m29_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m29_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256
          test "$(wc -l < RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-29-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256
            results_m29_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_29_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-29-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m29_preflight/coverage.json \
            MILESTONE_29_COVERAGE_PREFLIGHT_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M29_COVERAGE_PREFLIGHT.sha256 \
            results_m29_preflight \
            MILESTONE_29_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 29 coverage preflight"
          git push origin HEAD:main
