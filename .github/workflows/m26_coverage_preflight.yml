name: Milestone 26 HD 19994 b coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m26_coverage_preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_26_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "f6b7a87af853fbe509d5b19d9ab082d7ab7c02217b5ca725bdb8921a83354b56"
          test "$(sha256sum results_m26_selected_metadata/hd19994b.json | cut -d' ' -f1)" \
            = "0d522301a5774ad8232d0bb3f12ffc7052bf00a7868d9ef7303c2ba5209229fe"
          test "$(sha256sum config/hd19994b_m26_preflight.json | cut -d' ' -f1)" \
            = "296764ca3d39a34c975fc086e56246a2063b6cb4a8963b9c93e0eeef1e64f8b4"
          test "$(sha256sum scripts/m14_coverage_preflight.py | cut -d' ' -f1)" \
            = "95eb2dfc6c0b52db391ab09b844e553b5244de48203827134acdde640474115c"

      - name: Run metadata-only full-bank coverage proof
        run: |
          python scripts/m14_coverage_preflight.py \
            config/hd19994b_m26_preflight.json \
            --output results_m26_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m26_preflight/coverage.json').read_text())
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m26_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M26_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-26-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M26_COVERAGE_PREFLIGHT.sha256
            results_m26_preflight/
