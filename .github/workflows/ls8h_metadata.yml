name: LS8H GJ849 paired-image metadata preflight

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8h_metadata.yml'

permissions:
  contents: write

concurrency:
  group: ls8h-metadata
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 astropy==7.0.2
      - name: Acquire metadata only and build exact joins
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/ls8h_metadata.py | tee /tmp/ls8h_acquire.log
          python -u scripts/ls8h_join_metadata.py | tee /tmp/ls8h_join.log
          cp /tmp/ls8h_acquire.log results_ls8h_metadata/acquisition.log
          cp /tmp/ls8h_join.log results_ls8h_metadata/join.log
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('config/ls8h_images.json').read_text())
          assert m['status']=='METADATA_JOINED_IMAGES_CLOSED'
          assert m['join_rows']==58
          assert m['image_science_bytes']==18560000
          assert m['smearing_bytes']==46400
          assert m['image_pixels_read']==0
          assert len(m['contexts'])==1
          c=m['contexts'][0]
          assert (c['start'],c['duration'],c['lo'],c['hi'])==(75,1,61,90)
          assert len(c['image_rows']['SCI_CAL_SubArray'])==29
          assert len(c['image_rows']['SCI_COR_SubArray'])==29
          PY
      - name: Publish LS8H closed-image metadata manifest
        shell: bash
        run: |
          set -euo pipefail
          git add results_ls8h_metadata config/ls8h_images.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish LS8H GJ 849 paired-image metadata joins'
          git push origin HEAD:m43-support-qualification
