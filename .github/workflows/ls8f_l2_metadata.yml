name: LS8F GJ514 DEFAULT L2 header preflight

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8f_l2_metadata.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FROZEN: 820ef9893c053a04984c35f56ae7450ea1ba7132
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Prepare exact frozen metadata worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls8f-meta "$FROZEN"
          test "$(git -C /tmp/ls8f-meta rev-parse HEAD)" = "$FROZEN"
          python -m pip install -r /tmp/ls8f-meta/requirements_ls7g.txt
      - name: Run bounded header-only preflight
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8f-meta
          python -u scripts/ls8f_l2_metadata.py 2>&1 | tee /tmp/ls8f_meta.log
          cp /tmp/ls8f_meta.log results_ls8f_l2_metadata/RUN.log
          python -m pip freeze > results_ls8f_l2_metadata/environment.txt
      - name: Enforce zero table bytes and compatible schema
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8f-meta
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('results_ls8f_l2_metadata'); s=json.loads((out/'summary.json').read_text())
          assert s['status']=='PASS_COMPATIBLE' and s['compatible_schema'] is True
          assert s['table_data_bytes_acquired']==s['lightcurve_values_read']==s['image_pixels_read']==0
          assert s['selected_keys']==['CH_PR100018_TG007501_V0300','CH_PR100018_TG007502_V0300']
          for r in s['products']:
            assert r['table_data_bytes_acquired']==0 and r['row_bytes']==138
            assert r['keywords']['PIPE_VER']=='14.1.2' and int(r['keywords']['NEXP'])==2
            assert abs(float(r['keywords']['EXPTIME'])-22.0)<1e-9 and abs(float(r['keywords']['TEXPTIME'])-44.0)<1e-6
            q=json.loads((out/r['file_key']/'ranges.json').read_text())
            assert q['total_bytes_read']==r['table_data_start'] and q['total_bytes_read']<=65536
          rows=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS'):
            rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n')
          (out/'SHA256SUMS').write_text(''.join(rows))
          PY
          (cd results_ls8f_l2_metadata && sha256sum -c SHA256SUMS)
      - name: Publish LS8F header freeze
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_ls8f_l2_metadata
          cp -a /tmp/ls8f-meta/results_ls8f_l2_metadata .
          git add results_ls8f_l2_metadata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish LS8F GJ 514 DEFAULT L2 header freeze'
          git push origin HEAD:m43-support-qualification
