name: Radio native-v2 measurable local publisher control 20261001a

on:
  push:
    branches: [m43-support-qualification]
    paths: ['config/radio_native_v2_actions_control_20261001a.activate.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: radio-native-v2-actions-control-20261001a
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.repository == 'andersenmartin-blip/setisearch' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/m43-support-qualification' &&
      github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out exact engineering activation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/radio_native_v2_actions_control_20261001a.yml
            /scripts/radio_native_v2_actions_activation_gate.py
            /scripts/radio_native_v2_actions_supervisor.py
            /scripts/radio_native_v2_actions_publisher_control.py
            /config/radio_native_v2_actions_control_20261001a.*.json

      - name: Require complete immutable preparation readback
        id: activation
        run: >-
          python3 -B scripts/radio_native_v2_actions_activation_gate.py
          --root . --output "$RUNNER_TEMP/radio-native-v2-actions-control-20261001a-activation.json"

      - name: Independently measure one maximum-source publisher
        id: control
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/radio_native_v2_actions_supervisor.py \
            --root . \
            --output "$RUNNER_TEMP/radio-native-v2-actions-control-20261001a" \
            --activation-sha "$GITHUB_SHA" \
            --expected-parent "$GITHUB_SHA" \
            --protocol config/radio_native_v2_actions_control_20261001a.protocol.json \
            --activation-proof "$RUNNER_TEMP/radio-native-v2-actions-control-20261001a-activation.json"

      - name: Preserve lossless control and observer evidence
        if: always() && steps.activation.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/radio_native_v2_actions_publisher_control.py \
            publish-evidence --root . \
            --output "$RUNNER_TEMP/radio-native-v2-actions-control-20261001a" \
            --activation-sha "$GITHUB_SHA"

      - name: Require successful measured component control
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.control.outcome }}
        run: test "$CONTROL_OUTCOME" = success
