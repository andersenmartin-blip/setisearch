name: Milestone 16 HD 219134 candidate investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m16_candidate_investigation.yml"

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify frozen inputs and investigation protocol
        run: |
          test "$(sha256sum config/hd219134h_heldout_m16.json | cut -d' ' -f1)" \
            = "8f2da40aaa1b80fbbc4d34087dde5ef2cd565d7d7da7319fa52264e94d38919f"
          test "$(sha256sum results_m16/search_summary.json | cut -d' ' -f1)" \
            = "c68a202f5aacb48bfe1ef3421abff39e8c10ed97f4901076aba186fa5cbccb3b"
          test "$(sha256sum scripts/m11_candidate_investigation.py | cut -d' ' -f1)" \
            = "6565eb733fb5b3011564a8e98fce32c907aa90ab3890cfb7e9400c4c6419d2cb"
          test "$(sha256sum scripts/m16_candidate_investigation.py | cut -d' ' -f1)" \
            = "f66926928419783cc3befe805b3f0d226a35f379df1c830caa3186bc2affa961"
          test "$(sha256sum MILESTONE_16_CANDIDATE_INVESTIGATION_PLAN.md | cut -d' ' -f1)" \
            = "eed8b8c7598d5a9d21fc2d1f5c72d60c343075b40c695426d051017de2f43aff"

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Run fixed targeted morphology review
        run: |
          python scripts/m16_candidate_investigation.py \
            --config config/hd219134h_heldout_m16.json \
            --summary results_m16/search_summary.json \
            --data-dir data_m16_candidate_investigation \
            --output-dir results_m16_candidate_investigation \
            --extract \
            --date-utc 2026-08-22

      - name: Hash extracted slices and results
        run: |
          find data_m16_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256
          find results_m16_candidate_investigation -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256
          test "$(wc -l < DATA_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256)" -eq 12
          test "$(wc -l < RESULTS_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256)" -eq 5

      - name: Upload investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-16-candidate-investigation
          if-no-files-found: warn
          retention-days: 90
          path: |
            DATA_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256
            RESULTS_MANIFEST_M16_CANDIDATE_INVESTIGATION.sha256
            results_m16_candidate_investigation/
