name: LS8E frozen GJ876 two-visit L2 screen

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8e_l2_screen.yml'

permissions:
  contents: write

concurrency:
  group: ls8e-gj876-l2-screen
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FROZEN: 1e68a59f2b363ad414a4b2a497114e75359c3985
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Prepare exact frozen evaluation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ls8e-eval "$FROZEN"
          test "$(git -C /tmp/ls8e-eval rev-parse HEAD)" = "$FROZEN"
          python -m pip install -r /tmp/ls8e-eval/requirements_ls7g.txt
      - name: Run pre-access known-answer tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8e-eval
          python -m unittest tests.test_ls7x_l2 tests.test_ls8b_stable -v 2>&1 | tee /tmp/ls8e_tests.log
      - name: Acquire only frozen table ranges and evaluate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8e-eval
          python -u scripts/ls8e_l2_screen.py --freeze "$FROZEN" 2>&1 | tee /tmp/ls8e_run.log
      - name: Run independent struct and scalar audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8e-eval
          python -u scripts/ls8e_l2_audit.py 2>&1 | tee /tmp/ls8e_audit.log
      - name: Verify audited scope and seal evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ls8e-eval
          cp /tmp/ls8e_tests.log results_ls8e_l2_screen/TESTS.log
          cp /tmp/ls8e_run.log results_ls8e_l2_screen/RUN.log
          cp /tmp/ls8e_audit.log results_ls8e_l2_screen/AUDIT.log
          python -m pip freeze > results_ls8e_l2_screen/environment.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out=Path('results_ls8e_l2_screen')
          s=json.loads((out/'summary.json').read_text())
          a=json.loads((out/'audit.json').read_text())
          assert s['status']=='COMPLETE_AUDITED', s
          assert a['status']=='PASS', a
          assert s['evaluation_freeze_commit']=='1e68a59f2b363ad414a4b2a497114e75359c3985'
          assert s['selected_keys']==[
            'CH_PR100018_TG032801_V0300',
            'CH_PR100018_TG032802_V0300',
          ]
          assert s['totals']['rows']==227
          assert s['totals']['science_table_bytes']==31326
          assert s['image_bytes_acquired']==0
          assert s['raw_imagettes_opened'] is False
          assert s['other_apertures_opened'] is False
          assert s['detector_qualified'] is False
          assert s['candidate_claims']==0
          raw=sum((out/k/'lightcurve_table.bin').stat().st_size for k in s['selected_keys'])
          assert raw==31326
          rows=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS'):
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n')
          (out/'SHA256SUMS').write_text(''.join(rows))
          PY
          (cd results_ls8e_l2_screen && sha256sum -c SHA256SUMS)
      - name: Publish complete LS8E evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_ls8e_l2_screen
          cp -a /tmp/ls8e-eval/results_ls8e_l2_screen .
          git add results_ls8e_l2_screen
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish audited LS8E GJ 876 two-visit L2 screen'
          git push origin HEAD:m43-support-qualification
