name: Milestone 36 HIP 48714 b high-smearing coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m36_coverage_preflight.yml"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require first and only canonical preflight publication
        run: |
          test ! -e results_m36_preflight
          test ! -e RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256
          test ! -e MILESTONE_36_COVERAGE_PREFLIGHT_PROVENANCE.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector dependencies
        run: python -m pip install -e .

      - name: Verify frozen preflight inputs
        run: |
          test "$(sha256sum MILESTONE_36_SELECTED_METADATA_RESULT.md | cut -d' ' -f1)" \
            = "15a591190fa85e2ba1b5067ef60e42a2fbe97338eec0cf2ed3917674b1a536d0"
          test "$(sha256sum results_m36_selected_metadata/hip48714b.json | cut -d' ' -f1)" \
            = "787f0d5a905e0f6f54aaffea6cb4c2af68183888bbdb4a5a026b5899fe81bc04"
          test "$(sha256sum config/hip48714b_m36_preflight.json | cut -d' ' -f1)" \
            = "b344739cd70835e1032044f09af5b86a4c743b28e3c9b424ea6cf68c9a876131"
          test "$(sha256sum scripts/m36_coverage_preflight.py | cut -d' ' -f1)" \
            = "587fa8b25a06754e29b1434f29180c7fc57e5161b5846beb524b362375b4cb7d"
          git merge-base --is-ancestor \
            81e09794a92434beed8c9f0a5c81121a11f20417 "$GITHUB_SHA"

      - name: Run metadata-only motion, width, and report-cap proof
        run: |
          python scripts/m36_coverage_preflight.py \
            config/hip48714b_m36_preflight.json \
            --output results_m36_preflight/coverage.json

      - name: Verify boundary and hash result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m36_preflight/coverage.json').read_text()
          )
          assert result['passed'] is True
          assert result['checks'] == 630
          assert result['template_count'] == 21
          assert result['activity_subset_count'] == 4
          assert result['spectral_width_bank_channels'] == [
              1, 3, 5, 9, 17, 33, 65, 129
          ]
          assert result['spectral_half_width_channels'] == 64
          assert result['peaks_per_hypothesis'] == 3
          assert result['maximum_hypothesis_peaks_per_window'] == 2016
          assert result['candidate_report_cap'] == 2200
          assert result['candidate_report_cap_nontruncating'] is True
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          PY
          find results_m36_preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256
          test "$(wc -l < RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256)" -eq 1
          sha256sum -c RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-36-coverage-preflight
          if-no-files-found: error
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256
            results_m36_preflight/

      - name: Record provenance and publish checked preflight
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_36_COVERAGE_PREFLIGHT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'source_commit': os.environ['GITHUB_SHA'],
                      'selected_metadata_result_commit':
                          '81e09794a92434beed8c9f0a5c81121a11f20417',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-36-coverage-preflight',
                      'spectral_payload_inspected': False,
                      'remote_files_opened': False,
                      'spectral_width_bank_channels': [
                          1, 3, 5, 9, 17, 33, 65, 129
                      ],
                      'maximum_hypothesis_peaks_per_window': 2016,
                      'candidate_report_cap': 2200,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY
          jq empty results_m36_preflight/coverage.json \
            MILESTONE_36_COVERAGE_PREFLIGHT_PROVENANCE.json
          sha256sum -c RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add RESULTS_MANIFEST_M36_COVERAGE_PREFLIGHT.sha256 \
            results_m36_preflight \
            MILESTONE_36_COVERAGE_PREFLIGHT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish Milestone 36 coverage preflight"
          git push origin HEAD:main
