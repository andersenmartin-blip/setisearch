name: LS8F frozen GJ 514 two-visit L2 screen

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls8f_l2_screen.yml'

permissions:
  contents: write

concurrency:
  group: ls8f-gj514-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5 astropy==7.0.2
      - name: Run frozen GJ 514 screen and independent audit
        shell: bash
        run: |
          set -euo pipefail
          freeze="$(git rev-parse HEAD)"
          python -u scripts/ls8f_l2_screen.py --freeze "$freeze" | tee /tmp/ls8f_run.log
          python -u scripts/ls8f_l2_audit.py | tee /tmp/ls8f_audit.log
          cp /tmp/ls8f_run.log results_ls8f_l2_screen/RUN.log
          cp /tmp/ls8f_audit.log results_ls8f_l2_screen/AUDIT.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results_ls8f_l2_screen')
          s=json.loads((p/'summary.json').read_text())
          a=json.loads((p/'audit.json').read_text())
          assert s['status']=='COMPLETE_AUDITED'
          assert a['status']=='PASS'
          assert s['target']=='GJ 514'
          assert s['selected_keys']==['CH_PR100018_TG007501_V0300','CH_PR100018_TG007502_V0300']
          assert s['totals']['science_table_bytes']==20976
          assert s['image_bytes_acquired']==0
          assert s['raw_imagettes_opened'] is False
          report=f"""# LS8F: audited two-visit GJ 514 DEFAULT-L2 screen

Completed 20 September 2026. The two exact GJ 514 visits were selected
mechanically from the already frozen LS8E metadata ledger before science-table
access. Header-only preflight established a compatible DEFAULT-L2 schema with
zero table bytes before this screen was frozen.

## Result

- visits: `CH_PR100018_TG007501_V0300`, `CH_PR100018_TG007502_V0300`
- rows: **{s['totals']['rows']}**
- eligible 1/2/3-row windows: **{s['totals']['eligible_windows']}**
- positive windows / clusters: **{s['totals']['positive_windows']} / {s['totals']['positive_clusters']}**
- negative windows / clusters: **{s['totals']['negative_windows']} / {s['totals']['negative_clusters']}**
- exact science-table bytes: **{s['totals']['science_table_bytes']}**
- independent audit: **PASS**, {a['numeric_and_discrete_comparisons']:,} comparisons
- image bytes: **0**

The unchanged flux-centered cadence-unit rule, durations, sidebands, guards,
eligibility and symmetric +/-8.5 endpoints were fixed before the table values
were opened. Signed screen values are descriptive controls, not Gaussian
significances. Overlapping windows are not independent trials.

Any threshold crossing remains only an L2 excursion. CAL/COR image access
requires a separately frozen diagnostic after this complete two-visit result.
No raw imagette, alternate aperture or additional GJ 514 visit is opened here.
"""
          (p/'REPORT.md').write_text(report)
          PY
      - name: Publish audited LS8F result
        shell: bash
        run: |
          set -euo pipefail
          git add results_ls8f_l2_screen
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish audited LS8F GJ 514 two-visit L2 screen'
          git push origin HEAD:m43-support-qualification
