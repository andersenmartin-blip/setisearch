name: Milestone 31 higher-smearing held-out HD 192263 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m31_heldout_search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_31_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "da9e0f19070838bc41dd81d98be5a811504b05e2ac365f2d893a8bfecfbe2bcf"
          test "$(sha256sum config/hd192263b_heldout_m31.json | cut -d' ' -f1)" \
            = "4037921bc5fabd38e606455f1d515b97da8ffcf1aab2a993553ab114929ee986"
          test "$(sha256sum results_m31_selected_metadata/hd192263b.json | cut -d' ' -f1)" \
            = "d453e45be5a66894978d4f3d17d150a512eb249db8e2f0247e26b7fd2f03dc84"
          test "$(sha256sum results_m31_preflight/coverage.json | cut -d' ' -f1)" \
            = "4f38c6d0fda2d007705e038ada063169533b74cc1e4ec4ee636f8e7671164cca"
          git merge-base --is-ancestor \
            e1d53fafef00b89c9c55b6b8e8c2b53d639b0eb7 "$GITHUB_SHA"

      - name: Validate detector and repeat width-aware coverage proof
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 18.253611008 \
            --channel-width 2.7939677238464355 \
            --output validation_m31.json
          python scripts/m31_coverage_preflight.py \
            config/hd192263b_heldout_m31.json \
            --output results_m31/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m31
          python -m pip freeze > results_m31/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m31/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit':
                          '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit':
                          'e1d53fafef00b89c9c55b6b8e8c2b53d639b0eb7',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256':
                          '4037921bc5fabd38e606455f1d515b97da8ffcf1aab2a993553ab114929ee986',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd192263b_heldout_m31.json \
            --data-dir data_m31

      - name: Hash extracted slices
        run: |
          find data_m31 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M31.sha256
          test "$(wc -l < DATA_MANIFEST_M31.sha256)" -eq 30

      - name: Run frozen detector with complete wider-bank cluster retention
        run: |
          seti-repeater search \
            --config config/hd192263b_heldout_m31.json \
            --data-dir data_m31 \
            --output-dir results_m31

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m31/search_summary.json').read_text())
          assert result['pipeline']['version'] == '0.5.0'
          assert result['search_dimensions']['spectral_width_templates'] == [
              1, 3, 5, 9, 17, 33
          ]
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1512
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m31 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M31.sha256
          test "$(wc -l < RESULTS_MANIFEST_M31.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M31.sha256

      - name: Upload held-out evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: milestone-31-held-out-results
          if-no-files-found: error
          retention-days: 90
          path: |
            validation_m31.json
            DATA_MANIFEST_M31.sha256
            RESULTS_MANIFEST_M31.sha256
            results_m31/

      - name: Record artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('MILESTONE_31_HELDOUT_PROVENANCE.json').write_text(
              json.dumps(
                  {
                      'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'preregistration_commit':
                          'e1d53fafef00b89c9c55b6b8e8c2b53d639b0eb7',
                      'frozen_config_sha256':
                          '4037921bc5fabd38e606455f1d515b97da8ffcf1aab2a993553ab114929ee986',
                      'artifact_id': int(os.environ['ARTIFACT_ID']),
                      'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                      'artifact_name': 'milestone-31-held-out-results',
                      'higher_smearing_width_bank_channels': [
                          1, 3, 5, 9, 17, 33
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n'
          )
          PY

      - name: Publish checked result files atomically
        run: |
          test "$(wc -l < DATA_MANIFEST_M31.sha256)" -eq 30
          test "$(wc -l < RESULTS_MANIFEST_M31.sha256)" -eq 9
          sha256sum -c RESULTS_MANIFEST_M31.sha256
          jq empty validation_m31.json \
            results_m31/search_summary.json \
            results_m31/completeness.json \
            results_m31/coverage_preflight_repeat.json \
            results_m31/run_metadata.json \
            MILESTONE_31_HELDOUT_PROVENANCE.json
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add validation_m31.json \
            DATA_MANIFEST_M31.sha256 \
            RESULTS_MANIFEST_M31.sha256 \
            results_m31 \
            MILESTONE_31_HELDOUT_PROVENANCE.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish complete Milestone 31 result"
          git push origin HEAD:main
