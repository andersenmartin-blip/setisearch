name: Milestone 25 held-out HD 164922 b search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m25_heldout_search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen detector and HDF5 adapter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            'h5py>=3.11,<4' \
            'fsspec[http]>=2024.6,<2027' \
            'hdf5plugin>=4.4,<7'

      - name: Verify preregistered configuration and provenance
        run: |
          test "$(sha256sum MILESTONE_25_PREREGISTRATION.md | cut -d' ' -f1)" \
            = "532fc7e44de54c75af6026e2e8d5c8553d5f215bd3e4028d8c031c1bd56736b7"
          test "$(sha256sum config/hd164922b_heldout_m25.json | cut -d' ' -f1)" \
            = "3ab7ea6e4a73f4ecbb024690148c2419de42df69fba461442972d0733af09868"
          test "$(sha256sum results_m25_selected_metadata/hd164922b.json | cut -d' ' -f1)" \
            = "d826ef7192f68194440e31cec7fe1bd701d60187e60fff48605f50b7d88dde52"
          test "$(sha256sum results_m25_preflight/coverage.json | cut -d' ' -f1)" \
            = "b04834e2dfd3097d329096380520e41b6ee10e7d06992e3bf8c63b1d2f1b4837"

      - name: Validate detector and repeat coverage proof before spectral contact
        run: |
          python -m unittest discover -s tests -v
          seti-repeater validate \
            --tsamp 17.986224128 \
            --channel-width 2.835503418452676 \
            --output validation_m25.json
          python scripts/m14_coverage_preflight.py \
            config/hd164922b_heldout_m25.json \
            --output results_m25/coverage_preflight_repeat.json

      - name: Record execution environment
        run: |
          mkdir -p results_m25
          python -m pip freeze > results_m25/environment.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('results_m25/run_metadata.json').write_text(
              json.dumps(
                  {
                      'github_repository': os.environ['GITHUB_REPOSITORY'],
                      'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'github_sha': os.environ['GITHUB_SHA'],
                      'github_ref': os.environ['GITHUB_REF'],
                      'detector_version_frozen': '0.5.0',
                      'frozen_detector_commit': '32720a0b5e097403f864e2b84d53a071d65d7c46',
                      'preregistration_commit': '8e92aa1c20f543ea62b2d532bdbdeca2bfb39e94',
                      'execution_commit': os.environ['GITHUB_SHA'],
                      'frozen_config_sha256': '3ab7ea6e4a73f4ecbb024690148c2419de42df69fba461442972d0733af09868',
                  },
                  indent=2,
              )
              + '\n'
          )
          PY

      - name: Extract preregistered HDF5 slices
        run: |
          python scripts/m13_hdf5_extract.py \
            config/hd164922b_heldout_m25.json \
            --data-dir data_m25

      - name: Hash extracted slices
        run: |
          find data_m25 -type f -name '*.npz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > DATA_MANIFEST_M25.sha256
          test "$(wc -l < DATA_MANIFEST_M25.sha256)" -eq 30

      - name: Run frozen detector v0.5.0 with complete cluster retention
        run: |
          seti-repeater search \
            --config config/hd164922b_heldout_m25.json \
            --data-dir data_m25 \
            --output-dir results_m25

      - name: Verify complete report cap and hash primary results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results_m25/search_summary.json').read_text())
          for window in result['windows'].values():
              reduction = window['candidate_reduction']
              assert reduction['cluster_count_before_report_limit'] <= 1008
              assert reduction['reported_cluster_count'] == \
                  reduction['cluster_count_before_report_limit']
          PY
          find results_m25 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > RESULTS_MANIFEST_M25.sha256

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-25-held-out-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            validation_m25.json
            DATA_MANIFEST_M25.sha256
            RESULTS_MANIFEST_M25.sha256
            results_m25/
