name: Milestone 15 GJ 581 extraction coverage preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m15_coverage_preflight.yml"
      - "config/gj581b_m15_preflight.json"
      - "metadata/m15_gj581_selection.json"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Confirm detector tests remain green
        run: python -m unittest discover -s tests -v

      - name: Prove every extraction covers every frozen template
        run: |
          python scripts/m14_coverage_preflight.py \
            config/gj581b_m15_preflight.json \
            --output results_m15_preflight/coverage.json

      - name: Enforce metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('results_m15_preflight/coverage.json').read_text()
          )
          assert result['spectral_payload_inspected'] is False
          assert result['remote_files_opened'] is False
          assert result['checks'] == 630
          assert result['passed'] is True
          print('all 630 metadata-only coverage checks passed')
          PY

      - name: Hash preflight evidence
        run: |
          sha256sum results_m15_preflight/coverage.json \
            > RESULTS_MANIFEST_M15_COVERAGE_PREFLIGHT.sha256

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: milestone-15-coverage-preflight
          if-no-files-found: warn
          retention-days: 90
          path: |
            RESULTS_MANIFEST_M15_COVERAGE_PREFLIGHT.sha256
            results_m15_preflight/coverage.json
