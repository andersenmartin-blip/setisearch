name: LS7W freeze-gate validation

on:
  push:
    branches: [m43-support-qualification]
    paths:
      - '.github/workflows/ls7w_freeze_gate_validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Run freeze gate
        run: python scripts/ls7w_freeze_gate.py
      - name: Run invariant tests
        run: python -m pytest -q tests/test_ls7w_freeze_gate.py
